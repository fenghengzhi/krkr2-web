name: Prepare tests
description: Install locked dependencies and restore the build from this workflow run
runs:
  using: composite
  steps:
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: '24.19.0'
        cache: npm
    - run: npm ci
      shell: bash
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: test-build
        path: ${{ runner.temp }}/krkr-test-build
    - name: Restore generated kernels, app and PWA releases
      shell: bash
      run: |
        tar -xzf "$RUNNER_TEMP/krkr-test-build/test-build.tar.gz"
        mkdir -p out/ci
