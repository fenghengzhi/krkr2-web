name: Video presentation diagnostic

on:
  workflow_dispatch:
    inputs:
      build-run:
        description: Existing build with identical application sources
        required: true
        type: string
      browser:
        description: Browser for the original overlay cases
        required: true
        default: chromium
        type: choice
        options:
          - chromium
          - webkit
      first-frame-barrier:
        description: Diagnostic-only gate before the first seek
        required: true
        default: false
        type: boolean
      cases:
        description: Overlay repetitions or hidden layer frame behavior
        required: true
        default: overlay
        type: choice
        options:
          - overlay
          - layer

permissions:
  contents: read
  actions: read

env:
  CI: 'true'
  KRKR_VIDEO_DIAGNOSTIC: '1'
  KRKR_VIDEO_FIRST_FRAME_BARRIER: ${{ inputs.first-frame-barrier && '1' || '0' }}

defaults:
  run:
    shell: bash

jobs:
  video:
    runs-on: ${{ inputs.browser == 'webkit' && 'macos-15' || 'ubuntu-24.04' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/prepare-tests
        with:
          build-run: ${{ inputs.build-run }}
      - run: npm run typecheck
      - run: npx playwright install --with-deps "${{ inputs.browser }}"
      - name: Prepare audio output
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y pulseaudio pulseaudio-utils
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=krkr_test_output rate=48000 channels=2
          pactl set-default-sink krkr_test_output
      - name: Record original cases with native event and frame observations
        env:
          PLAYWRIGHT_JSON_OUTPUT_FILE: out/ci/video-diagnostic.json
          KRKR_DIAGNOSTIC_BROWSER: ${{ inputs.browser }}
          KRKR_DIAGNOSTIC_WORKERS: ${{ inputs.browser == 'webkit' && '1' || '2' }}
          KRKR_DIAGNOSTIC_PATTERN: ${{ inputs.cases == 'layer' && 'video frames reach two layers' || 'overlay geometry' }}
          KRKR_DIAGNOSTIC_REPEATS: ${{ inputs.cases == 'layer' && '1' || '20' }}
        run: npx playwright test tests/browser/video.spec.ts --project="$KRKR_DIAGNOSTIC_BROWSER" --grep "$KRKR_DIAGNOSTIC_PATTERN" --repeat-each="$KRKR_DIAGNOSTIC_REPEATS" --workers="$KRKR_DIAGNOSTIC_WORKERS" --reporter=list,json 2>&1 | tee out/ci/video-diagnostic.log
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: video-diagnostic-results
          path: |
            out/ci/
            test-results/
          retention-days: 14
