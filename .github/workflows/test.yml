name: Tests
run-name: ${{ inputs.node-only && 'Node diagnostic (browser suites not run)' || inputs.runtime-only && 'Direct runtime diagnostic (application suites not run)' || github.event_name == 'push' && contains(github.event.head_commit.message, '[application tests]') && 'Application and compatibility tests' || 'Full test suite' }}

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      node-only:
        description: Run build and Node checks only; this is not a full regression result
        type: boolean
        default: false
      runtime-only:
        description: Run build and direct browser runtime checks only; not a full regression result
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}${{ inputs.node-only && '-node-diagnostic' || inputs.runtime-only && '-runtime-diagnostic' || '' }}
  # Keep the running suite and its evidence when a follow-up fix is queued.
  cancel-in-progress: false
  # Keep earlier pending batches too; the default single slot replaces them.
  queue: max

defaults:
  run:
    shell: bash

env:
  CI: 'true'

jobs:
  tools-types:
    name: Typecheck engine, tests and build tools
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.19.0'
          cache: npm
      - id: install-types
        run: npm ci
      - run: |
          mkdir -p out/ci
          npm run typecheck:tools 2>&1 | tee out/ci/types-tsconfig.tools.json.log
      - name: Check the engine without DOM types
        if: ${{ !cancelled() && steps.install-types.outcome == 'success' }}
        run: ./node_modules/.bin/tsc -p tsconfig.engine.json 2>&1 | tee out/ci/types-tsconfig.engine.json.log
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: ${{ !cancelled() }}
        with:
          name: tools-typecheck-log
          path: out/ci/types-tsconfig.*.log
          if-no-files-found: error
          retention-days: 90

  wave-speaker-reference:
    name: Verify WAVE speaker positions against FFmpeg
    if: ${{ !inputs.node-only && !inputs.runtime-only }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.19.0'
          cache: npm
      - run: npm ci
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: node --import tsx tests/probes/wave-speaker-mask-reference.ts
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: ${{ !cancelled() }}
        with:
          name: wave-speaker-mask-reference
          path: out/ci/wave-speaker-mask-reference/
          if-no-files-found: error
          retention-days: 90

  png-kernel:
    name: Production PNG inflater WebAssembly kernel
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: |
          mkdir -p out/ci
          cp native/image-zlib/source.json out/ci/image-zlib-source.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        id: node
        with:
          node-version: '24.19.0'
      - uses: emscripten-core/setup-emsdk@4528d102f7230f0e7b276855c01ea1159be0e984
        id: emsdk
        with:
          version: '6.0.9'
      - name: Prepare the exact zlib port source
        id: source
        run: python3 scripts/prepare-emscripten-ports.py --evidence out/ci/png-ports.json zlib 2>&1 | tee out/ci/png-ports.log
      - name: Build the PNG assets shared by the application and differential tests
        id: kernel
        run: |
          node scripts/build-image-zlib.mjs 2>&1 | tee out/ci/image-zlib.log
          tar -czf "$RUNNER_TEMP/zlib-kernel.tar.gz" .generated/image-zlib public/licenses/image-zlib
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: zlib-kernel
          path: ${{ runner.temp }}/zlib-kernel.tar.gz
          if-no-files-found: error
          retention-days: 90
      - name: Preserve source and toolchain step outcomes
        if: always()
        env:
          NODE_OUTCOME: ${{ steps.node.outcome }}
          EMSDK_OUTCOME: ${{ steps.emsdk.outcome }}
          SOURCE_OUTCOME: ${{ steps.source.outcome }}
          KERNEL_OUTCOME: ${{ steps.kernel.outcome }}
        run: |
          mkdir -p out/ci
          python3 - <<'PY'
          import json, os, pathlib
          fields = ['GITHUB_SHA', 'GITHUB_RUN_ID', 'GITHUB_RUN_ATTEMPT', 'NODE_OUTCOME', 'EMSDK_OUTCOME', 'SOURCE_OUTCOME', 'KERNEL_OUTCOME']
          pathlib.Path('out/ci/png-kernel-status.json').write_text(json.dumps({key: os.environ.get(key) for key in fields}, indent=2) + '\n')
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: png-kernel-build-logs
          path: |
            out/ci/
            out/native/image-zlib/compile-command.json
          if-no-files-found: error
          retention-days: 90

  jpeg-fixtures:
    name: Independent IJG fixture inputs
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Generate fixed-source inputs and record compiler output
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-multilib
          python3 scripts/run-native-jpeg-reference.py --fixtures-only --output out/verification/jpeg-fixtures
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: jpeg-fixtures
          path: out/verification/jpeg-fixtures/
          if-no-files-found: error
          retention-days: 90

  jpeg-kernel:
    name: Production IJG WebAssembly kernel
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.19.0'
      - uses: emscripten-core/setup-emsdk@4528d102f7230f0e7b276855c01ea1159be0e984
        with:
          version: '6.0.9'
      - name: Build the JPEG assets shared by the application and differential tests
        run: |
          mkdir -p out/ci
          node scripts/build-image-jpeg.mjs 2>&1 | tee out/ci/image-jpeg.log
          tar -czf "$RUNNER_TEMP/jpeg-kernel.tar.gz" .generated/image-jpeg public/licenses/image-jpeg
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: jpeg-kernel
          path: ${{ runner.temp }}/jpeg-kernel.tar.gz
          if-no-files-found: error
          retention-days: 90
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: jpeg-kernel-build-logs
          path: |
            out/ci/image-jpeg.log
            out/native/image-jpeg/compile-command.json
          retention-days: 90

  legacy-media-kernel:
    name: Production legacy movie WebAssembly converter
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.19.0'
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        id: legacy-cache
        with:
          path: |
            .generated/legacy-media
            public/licenses/legacy-media
          key: legacy-media-v1-${{ runner.os }}-${{ runner.arch }}-emsdk-6.0.9-${{ hashFiles('native/legacy-media/**', 'scripts/build-legacy-media.mjs') }}
      - uses: emscripten-core/setup-emsdk@4528d102f7230f0e7b276855c01ea1159be0e984
        if: steps.legacy-cache.outputs.cache-hit != 'true'
        with:
          version: '6.0.9'
      - name: Build only pinned legacy decoders and H264 AAC output
        if: steps.legacy-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p out/ci
          node scripts/build-legacy-media.mjs 2>&1 | tee out/ci/legacy-media.log
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        if: steps.legacy-cache.outputs.cache-hit != 'true'
        with:
          path: |
            .generated/legacy-media
            public/licenses/legacy-media
          key: ${{ steps.legacy-cache.outputs.cache-primary-key }}
      - name: Package the exact converter for application and hosted tests
        run: tar -czf "$RUNNER_TEMP/legacy-media-kernel.tar.gz" .generated/legacy-media public/licenses/legacy-media
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: legacy-media-kernel
          path: ${{ runner.temp }}/legacy-media-kernel.tar.gz
          if-no-files-found: error
          retention-days: 90
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: legacy-media-build-logs
          path: |
            out/ci/legacy-media.log
            out/native/legacy-media/commands.json
            out/native/legacy-media/source/ffmpeg-5.1.9/ffbuild/config.log
            .generated/legacy-media/manifest.json
          retention-days: 90

  windows-media9-originals:
    name: Master ${{ matrix.profile }} cutscene with Windows Media Foundation
    runs-on: windows-2025
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        profile: [wmv9, vc1]
    env:
      MOVIE_PROFILE: ${{ matrix.profile }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.19.0'
      - name: Prepare authored frames, stereo samples and their digests
        run: |
          mkdir -p out/windows-movie
          node --input-type=module <<'JS'
          import { writeWindowsMovieInputs } from './scripts/generate-legacy-video-fixtures.mjs'
          writeWindowsMovieInputs('out/windows-movie')
          JS
          mv out/windows-movie/wmv9-inputs.json "out/windows-movie/$MOVIE_PROFILE-source.json"
      - name: Enable the Windows media components if needed
        shell: powershell
        run: |
          $feature = Get-WindowsFeature -Name Server-Media-Foundation
          if ($feature -and !$feature.Installed) {
            $installed = Install-WindowsFeature -Name Server-Media-Foundation
            if (!$installed.Success) { throw 'Could not install Media Foundation on the hosted runner' }
          }
      - name: Build the Windows SDK media writer
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%V in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VSROOT=%%V"
          call "%VSROOT%\VC\Auxiliary\Build\vcvars64.bat" || exit /b 1
          cd out\windows-movie
          cl /nologo /std:c++17 /EHsc /W4 ..\..\tests\native\author-windows-media.cpp /Fe:author.exe /link ole32.lib mf.lib mfplat.lib mfuuid.lib mfreadwrite.lib
      - name: Encode the original WMV with the system audio and video codecs
        run: |
          cd out/windows-movie
          ./author.exe "$MOVIE_PROFILE" 2>&1 | tee "$MOVIE_PROFILE-encode.log"
          sha256sum "legacy-$MOVIE_PROFILE.wmv" > "$MOVIE_PROFILE-original.sha256"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: ${{ !cancelled() }}
        with:
          name: windows-media9-original-${{ matrix.profile }}
          path: |
            out/windows-movie/*.wmv
            out/windows-movie/*.json
            out/windows-movie/*.log
            out/windows-movie/*.sha256
          if-no-files-found: error
          retention-days: 90

  udf-metadata-disc:
    name: Master a UDF 2.50 game disc with Windows IMAPI
    runs-on: windows-2025
    timeout-minutes: 12
    outputs:
      disc-readback: ${{ steps.readback.outcome }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.19.0'
          cache: npm
      - run: npm ci
      - name: Prepare the original KAG project and chapter
        run: |
          dir=out/verification/disc-volumes
          mkdir -p "$dir"
          (cd "$dir" && python ../../../scripts/generate-story-disc.py --files-only)
          node --import tsx --input-type=module <<'JS'
          import { mkdirSync, writeFileSync } from 'node:fs'
          import { join } from 'node:path'
          import { discBootDirectory, discBootProjectFiles } from './tests/helpers/disc-boot.ts'
          const game = join('out/verification/disc-volumes/story-files', discBootDirectory)
          mkdirSync(game, { recursive: true })
          for (const { name, buffer } of discBootProjectFiles(false)) writeFileSync(join(game, name), buffer)
          JS
      - name: Master the image with redundant metadata
        shell: powershell
        run: |
          .\scripts\author-metadata-disc.ps1 -Source out/verification/disc-volumes/story-files -Output out/verification/disc-volumes/boot-udf250-metadata-source.iso
          .\scripts\author-metadata-disc.ps1 -Source out/verification/disc-volumes/story-files -Output out/verification/disc-volumes/boot-udf250-bridge-source.iso -Bridge
      - name: Check the actual partition map and independently extract every game file
        id: readback
        run: |
          python scripts/verify-metadata-disc.py
          python scripts/verify-metadata-disc.py --bridge
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: ${{ !cancelled() }}
        with:
          name: udf-metadata-disc
          path: |
            out/verification/disc-volumes/boot-udf250-metadata-source.iso
            out/verification/disc-volumes/udf-metadata-manifest.json
            out/verification/disc-volumes/boot-udf250-bridge-source.iso
            out/verification/disc-volumes/udf-bridge-manifest.json
          if-no-files-found: error
          retention-days: 90

      - name: Read the Japanese chapter through the Windows-mounted bridge disc
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $base = 'out/verification/disc-volumes'
          $iso = (Resolve-Path "$base/boot-udf250-bridge-source.iso").Path
          $mounted = Mount-DiskImage -ImagePath $iso -StorageType ISO -PassThru
          try {
            $until = [DateTime]::UtcNow.AddSeconds(15)
            do {
              $volume = $mounted | Get-Volume
              if ($volume.DriveLetter) { break }
              Start-Sleep -Milliseconds 250
            } while ([DateTime]::UtcNow -lt $until)
            if (!$volume.DriveLetter -or $volume.FileSystem -ne 'UDF' -or $volume.FileSystemLabel -ne 'KRKR_STORY') {
              throw "Unexpected mounted volume: $($volume.FileSystem) $($volume.FileSystemLabel)"
            }
            $chapter = (Get-ChildItem "$base/story-files/Routes" -Filter '*.tjs' | Where-Object { $_.Name -cmatch '[^\x00-\x7F]' }).Name
            if (!$chapter) { throw 'Source chapter missing' }
            $actual = Get-FileHash -LiteralPath "$($volume.DriveLetter):/Routes/$chapter"
            if ($actual.Hash -ne (Get-FileHash -LiteralPath "$base/story-files/Routes/$chapter").Hash) {
              throw 'Chapter differs on automatically mounted Windows game disc'
            }
            $volume | Format-List DriveLetter, FileSystem, FileSystemLabel
            $actual
          } finally { Dismount-DiskImage -ImagePath $iso }

  build:
    name: WASM, types and production build
    # Still compile the main VM when an independent image build fails.
    if: ${{ !cancelled() }}
    needs: [jpeg-fixtures, jpeg-kernel, png-kernel, legacy-media-kernel, udf-metadata-disc, windows-media9-originals]
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    outputs:
      legacy-fixtures: ${{ steps.legacy-fixtures.outcome }}
      windows-media-fixtures: ${{ steps.windows-media-fixtures.outcome }}
      wmv9-readback: ${{ steps.wmv9-readback.outcome }}
      vc1-readback: ${{ steps.vc1-readback.outcome }}
      quicktime-fixtures: ${{ steps.quicktime-fixtures.outcome }}
      mpeg2-xvid-fixtures: ${{ steps.mpeg2-xvid-fixtures.outcome }}
      avi-adpcm-fixtures: ${{ steps.avi-adpcm-fixtures.outcome }}
      dvd-audio-fixtures: ${{ steps.dvd-audio-fixtures.outcome }}
      large-dib-fixtures: ${{ steps.large-dib-fixtures.outcome }}
      deflate64-fixtures: ${{ steps.deflate64-fixtures.outcome }}
      udf-discs: ${{ steps.udf-discs.outcome }}
      udf-sparable-disc: ${{ steps.udf-sparable-disc.outcome }}
      long-vorbis-fixture: ${{ steps.long-vorbis-fixture.outcome }}
      cdda-aiff-fixtures: ${{ steps.cdda-aiff-fixtures.outcome }}
    steps:
      - name: Reject conflicting diagnostic selections
        if: ${{ inputs.node-only && inputs.runtime-only }}
        run: exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.19.0'
          cache: npm
      - run: npm ci
      - run: mkdir -p out/ci
      - name: Check pinned native TVP message catalog
        run: python3 scripts/generate-tvp-messages.py --check 2>&1 | tee out/ci/tvp-message-catalog.log
      - name: Check generated message syntax and the original failure control
        run: python3 tests/native/tvp-message-generation.py 2>&1 | tee out/ci/tvp-message-generation.log
      - name: Restore kernels built from the same native sources
        id: kernels
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .generated/wasm
            .generated/fonts
            public/licenses/freetype
          key: kernels-v1-${{ runner.os }}-${{ runner.arch }}-emsdk-6.0.9-${{ hashFiles('native/**', 'third_party/**', 'scripts/build-wasm.mjs', 'scripts/build-fonts.mjs', 'scripts/build-image-zlib.mjs', 'scripts/build-image-jpeg.mjs', 'scripts/prepare-emscripten-ports.py', 'scripts/generate-tvp-messages.py') }}
      - name: Install native build tools
        if: steps.kernels.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y bison cmake ninja-build python3
      - uses: emscripten-core/setup-emsdk@4528d102f7230f0e7b276855c01ea1159be0e984 # v16
        if: steps.kernels.outputs.cache-hit != 'true'
        with:
          version: '6.0.9'
      - name: Check native string append aliases and allocation failures
        run: |
          c++ -std=c++17 -O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer \
            -Ithird_party/tjs2 tests/native/string-append.cpp -o out/ci/string-append-native
          out/ci/string-append-native 2>&1 | tee out/ci/string-append-native.log
      - name: Build Asyncify, JSPI, font and image kernels
        if: steps.kernels.outputs.cache-hit != 'true'
        env:
          KRKR_SEPARATE_JPEG_BUILD: '1'
          KRKR_SEPARATE_PNG_BUILD: '1'
          KRKR_SEPARATE_LEGACY_MEDIA_BUILD: '1'
        run: |
          mkdir -p out/ci
          # The font port still needs its own zlib; its source preparation is
          # shared with the independent PNG build, not its compiled kernel.
          python3 scripts/prepare-emscripten-ports.py --evidence out/ci/font-ports.json zlib freetype 2>&1 | tee out/ci/font-ports.log
          npm run build:wasm 2>&1 | tee out/ci/wasm.log
      - name: Cache compiled kernels
        if: steps.kernels.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .generated/wasm
            .generated/fonts
            public/licenses/freetype
          key: ${{ steps.kernels.outputs.cache-primary-key }}
      - uses: ./.github/actions/restore-image-kernel
        with:
          kernel: zlib
      - uses: ./.github/actions/restore-image-kernel
        with:
          kernel: jpeg
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: legacy-media-kernel
          path: ${{ runner.temp }}/krkr-legacy-media
      - name: Restore this run's exact legacy movie converter
        run: tar -xzf "$RUNNER_TEMP/krkr-legacy-media/legacy-media-kernel.tar.gz"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: jpeg-fixtures
          path: out/verification/jpeg-fixtures/
      - name: Check application types and production release
        id: release
        run: (npm run typecheck:app && npm run bundle) 2>&1 | tee out/ci/build.log
      - name: Collect application TypeScript diagnostics after a release failure
        if: ${{ failure() && steps.release.outcome == 'failure' }}
        run: |
          failed=0
          for project in tsconfig.json tsconfig.worker.json tsconfig.engine.json; do
            if ! ./node_modules/.bin/tsc -p "$project" 2>&1 | tee "out/ci/types-$project.log"; then
              failed=1
            fi
          done
          exit "$failed"
      - name: Build offline update fixtures
        run: node scripts/build-pwa-fixtures.mjs 2>&1 | tee out/ci/pwa-build.log
      - name: Independently encode and read back Deflate64 games
        id: deflate64-fixtures
        continue-on-error: true
        timeout-minutes: 8
        run: |
          mkdir -p out/verification/deflate64-games
          sudo apt-get update 2>&1 | tee out/ci/deflate64-apt-update.log
          sudo apt-get install -y 7zip 2>&1 | tee out/ci/deflate64-apt-install.log
          node --import tsx scripts/generate-deflate64-game-fixtures.mjs 2>&1 | tee out/ci/deflate64-fixtures.log
      - name: Install independent movie fixture encoders
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        continue-on-error: true
        with:
          pattern: windows-media9-original-*
          merge-multiple: true
          path: out/verification/video-tracks
      - name: Independently decode the original WMV9 game cutscene on Linux
        id: wmv9-readback
        continue-on-error: true
        run: node --input-type=module -e "import { checkWindows9Fixture } from './scripts/generate-legacy-video-fixtures.mjs'; checkWindows9Fixture('out/verification/video-tracks')" 2>&1 | tee out/ci/wmv9-readback.log
      - name: Independently decode the original VC-1 and WMA Pro game cutscene on Linux
        id: vc1-readback
        continue-on-error: true
        run: node --input-type=module -e "import { checkVc1Fixture } from './scripts/generate-legacy-video-fixtures.mjs'; checkVc1Fixture('out/verification/video-tracks')" 2>&1 | tee out/ci/vc1-readback.log
      - name: Author QuickTime Animation and MPEG-4 Part 2 movies and verify all numbered pictures and sound
        id: quicktime-fixtures
        continue-on-error: true
        run: |
          mkdir -p out/verification/video-tracks
          node --input-type=module -e "import { generateQuickTimeFixtures } from './scripts/generate-legacy-video-fixtures.mjs'; generateQuickTimeFixtures('out/verification/video-tracks')" 2>&1 | tee out/ci/quicktime-fixtures.log
      - name: Generate and independently decode Windows Media fixtures
        id: windows-media-fixtures
        continue-on-error: true
        run: |
          node --input-type=module <<'JS' 2>&1 | tee out/ci/windows-media-fixtures.log
          import { mkdirSync } from 'node:fs'
          import { generateWindowsMediaFixtures } from './scripts/generate-legacy-video-fixtures.mjs'
          const directory = 'out/verification/video-tracks'
          mkdirSync(directory, { recursive: true })
          generateWindowsMediaFixtures(directory)
          JS
      - name: Generate and independently decode MPEG-2 and Xvid fixtures
        id: mpeg2-xvid-fixtures
        continue-on-error: true
        run: |
          node --input-type=module <<'JS' 2>&1 | tee out/ci/mpeg2-xvid-fixtures.log
          import { mkdirSync } from 'node:fs'
          import { generateMpeg2XvidFixtures } from './scripts/generate-legacy-video-fixtures.mjs'
          const directory = 'out/verification/video-tracks'
          mkdirSync(directory, { recursive: true })
          generateMpeg2XvidFixtures(directory)
          JS
      - name: Generate and independently decode MS Video 1 and DivX 3 AVI with ADPCM
        id: avi-adpcm-fixtures
        continue-on-error: true
        run: |
          node --input-type=module <<'JS' 2>&1 | tee out/ci/avi-adpcm-fixtures.log
          import { mkdirSync } from 'node:fs'
          import { generateAviAdpcmFixtures } from './scripts/generate-legacy-video-fixtures.mjs'
          const directory = 'out/verification/video-tracks'
          mkdirSync(directory, { recursive: true })
          generateAviAdpcmFixtures(directory)
          JS
      - name: Author a bilingual MPEG cutscene and independently decode its AC-3 and DVD LPCM tracks
        id: dvd-audio-fixtures
        continue-on-error: true
        run: |
          node --input-type=module <<'JS' 2>&1 | tee out/ci/dvd-audio-fixtures.log
          import { mkdirSync } from 'node:fs'
          import { generateDvdAudioFixtures } from './scripts/generate-legacy-video-fixtures.mjs'
          const directory = 'out/verification/video-tracks'
          mkdirSync(directory, { recursive: true })
          generateDvdAudioFixtures(directory)
          JS
      - name: Author a full-size DIB AVI and record packets beyond 128 MiB
        id: large-dib-fixtures
        continue-on-error: true
        run: |
          node --input-type=module <<'JS' 2>&1 | tee out/ci/large-dib-fixtures.log
          import { mkdirSync } from 'node:fs'
          import { generateLargeDibFixture } from './scripts/generate-legacy-video-fixtures.mjs'
          const directory = 'out/verification/video-tracks'
          mkdirSync(directory, { recursive: true })
          generateLargeDibFixture(directory)
          JS
          gzip -n out/verification/video-tracks/legacy-large-dib.avi
      - name: Encode and independently decode long Vorbis music
        id: long-vorbis-fixture
        continue-on-error: true
        run: |
          mkdir -p out/verification/long-vorbis
          node scripts/generate-long-vorbis-fixture.mjs 2>&1 | tee out/ci/long-vorbis-fixture.log
      - name: Encode and independently mix multichannel Vorbis game music
        id: vorbis-speakers
        continue-on-error: true
        run: |
          mkdir -p out/verification/vorbis-speakers
          node scripts/generate-vorbis-speaker-fixtures.mjs 2>&1 | tee out/ci/vorbis-speakers.log
      - name: Include the same-run IMAPI game disc in the browser and Node test inputs
        if: needs.udf-metadata-disc.outputs.disc-readback == 'success'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: udf-metadata-disc
          path: out/verification/disc-volumes
      - name: Author ISO and Joliet data tracks and read back their contents
        id: disc-volumes
        continue-on-error: true
        run: |
          dir=out/verification/disc-volumes
          mkdir -p "$dir/files"
          sudo apt-get install -y genisoimage
          cd "$dir"
          echo 'Disc identification scene' > files/SCENE.TXT
          genisoimage -quiet -V KRKR_PLAIN -o plain.iso files
          genisoimage -quiet -J -V KIRIKIRI_DISC -o joliet.iso files
          isoinfo -i plain.iso -d > plain.txt
          isoinfo -i joliet.iso -d > joliet.txt
          grep -Eq '^Volume id: KRKR_PLAIN[[:space:]]*$' plain.txt
          grep -Eq '^Volume id: KIRIKIRI_DISC[[:space:]]*$' joliet.txt
          isoinfo -i plain.iso -x '/SCENE.TXT;1' > plain-scene.txt
          isoinfo -i joliet.iso -J -f > joliet-files.txt
          mapfile -t joliet_files < joliet-files.txt
          [[ ${#joliet_files[@]} = 1 && ( ${joliet_files[0]} = '/SCENE.TXT' || ${joliet_files[0]} = '/SCENE.TXT;1' ) ]]
          isoinfo -i joliet.iso -J -x "${joliet_files[0]}" > joliet-scene.txt
          cmp files/SCENE.TXT plain-scene.txt
          cmp files/SCENE.TXT joliet-scene.txt
          python3 "$GITHUB_WORKSPACE/scripts/generate-story-disc.py"
          sha256sum plain.iso joliet.iso story.iso > SHA256SUMS
      - name: Author bootable KAG discs and extract the original project files independently
        id: boot-discs
        if: steps.disc-volumes.outcome == 'success'
        continue-on-error: true
        run: node --import tsx scripts/generate-boot-disc.mjs
      - name: Master a mixed-mode CloneCD game disc and check the IMG against its original tracks
        id: clone-cd-game
        if: steps.boot-discs.outcome == 'success'
        continue-on-error: true
        run: |
          sudo apt-get install -y build-essential cmake flex bison bchunk
          python3 scripts/generate-ccd-game.py
      - name: Package original KAG discs in single and numbered ZIP releases
        if: steps.boot-discs.outcome == 'success'
        continue-on-error: true
        run: python3 scripts/generate-disc-releases.py
      - name: Author and independently mount UDF 1.02 and 2.01 KAG DVDs
        id: udf-discs
        if: steps.boot-discs.outcome == 'success'
        continue-on-error: true
        run: |
          sudo apt-get install -y udftools 7zip
          python3 scripts/generate-udf-game-discs.py 2>&1 | tee out/ci/udf-discs.log
      - name: Author a sparable UDF 2.01 DVD-RW and independently read its relocated game
        id: udf-sparable-disc
        if: steps.boot-discs.outcome == 'success'
        continue-on-error: true
        run: |
          sudo apt-get install -y udftools
          python3 scripts/generate-udf-game-discs.py --sparable 2>&1 | tee out/ci/udf-sparable-disc.log
      - name: Create interchangeable game discs and independently read their shared paths
        if: steps.disc-volumes.outcome == 'success'
        continue-on-error: true
        run: python3 scripts/generate-disc-swap.py
      - name: Encode and independently decode AIFF disc tracks
        id: cdda-aiff-fixtures
        continue-on-error: true
        run: |
          mkdir -p out/verification/cdda-aiff
          node scripts/generate-cdda-aiff.mjs 2>&1 | tee out/ci/cdda-aiff.log
      - name: Generate shared project-owned video track fixtures
        run: |
          node scripts/generate-video-track-fixtures.mjs 2>&1 | tee out/ci/video-track-fixtures.log
      - name: Generate and independently decode legacy movie fixtures
        id: legacy-fixtures
        continue-on-error: true
        run: |
          node --input-type=module <<'JS' 2>&1 | tee out/ci/legacy-video-fixtures.log
          import { readFileSync, writeFileSync } from 'node:fs'
          import { generateLegacyVideoFixtures } from './scripts/generate-legacy-video-fixtures.mjs'
          const directory = 'out/verification/video-tracks'
          const path = directory + '/provenance.json'
          const provenance = JSON.parse(readFileSync(path, 'utf8'))
          provenance.legacyVideo = generateLegacyVideoFixtures(directory)
          writeFileSync(path, JSON.stringify(provenance, null, 2) + '\n')
          JS
      - name: Package the exact build for all test jobs
        env:
          KERNEL_CACHE_KEY: ${{ steps.kernels.outputs.cache-primary-key }}
          KERNEL_CACHE_HIT: ${{ steps.kernels.outputs.cache-hit }}
        run: |
          node --input-type=module <<'JS'
          import { writeFileSync } from 'node:fs'
          writeFileSync('out/ci/build-info.json', JSON.stringify({
            commit: process.env.GITHUB_SHA,
            runId: process.env.GITHUB_RUN_ID,
            attempt: process.env.GITHUB_RUN_ATTEMPT,
            node: process.version,
            platform: process.platform,
            arch: process.arch,
            kernels: {
              cacheKey: process.env.KERNEL_CACHE_KEY,
              cacheHit: process.env.KERNEL_CACHE_HIT === 'true',
            },
          }, null, 2) + '\n')
          JS
          mkdir -p out/verification/clone-cd-game
          tar -czf "$RUNNER_TEMP/test-build.tar.gz" \
            .generated dist out/ci/build-info.json \
            public/licenses/image-zlib public/licenses/image-jpeg public/licenses/legacy-media \
            out/verification/pwa/site-a out/verification/pwa/site-b \
            out/verification/pwa/fixture-artifacts.json out/verification/video-tracks \
            out/verification/deflate64-games \
            out/verification/long-vorbis out/verification/vorbis-speakers \
            out/verification/cdda-aiff out/verification/disc-volumes out/verification/clone-cd-game \
            out/verification/jpeg-fixtures/inputs \
            out/verification/jpeg-fixtures/case-manifest.json out/verification/jpeg-fixtures/codes.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-build
          path: ${{ runner.temp }}/test-build.tar.gz
          if-no-files-found: error
          retention-days: 90
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: build-logs
          path: out/ci/
          retention-days: 90
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: ${{ !cancelled() && (steps.deflate64-fixtures.outcome == 'success' || steps.deflate64-fixtures.outcome == 'failure') }}
        with:
          name: deflate64-fixture-evidence
          path: |
            out/verification/deflate64-games/
            out/ci/deflate64*.log
          if-no-files-found: error
          retention-days: 90
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: ${{ !cancelled() && (steps.windows-media-fixtures.outcome == 'success' || steps.windows-media-fixtures.outcome == 'failure') }}
        with:
          name: windows-media-fixture-evidence
          path: |
            out/verification/video-tracks/windows-media*
            out/verification/video-tracks/legacy-wmv1*
            out/verification/video-tracks/legacy-wmv2*
          if-no-files-found: error
          retention-days: 90
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: ${{ !cancelled() && (steps.quicktime-fixtures.outcome == 'success' || steps.quicktime-fixtures.outcome == 'failure' || steps.wmv9-readback.outcome == 'failure' || steps.vc1-readback.outcome == 'failure') }}
        with:
          name: independent-cutscene-readback
          path: |
            out/verification/video-tracks/wmv9*
            out/verification/video-tracks/vc1*
            out/verification/video-tracks/legacy-wmv9*
            out/verification/video-tracks/legacy-vc1*
            out/verification/video-tracks/quicktime*
            out/verification/video-tracks/legacy-animation*
            out/verification/video-tracks/legacy-part2*
          if-no-files-found: error
          retention-days: 90
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: ${{ !cancelled() && (steps.mpeg2-xvid-fixtures.outcome == 'success' || steps.mpeg2-xvid-fixtures.outcome == 'failure') }}
        with:
          name: mpeg2-xvid-fixture-evidence
          path: |
            out/verification/video-tracks/mpeg2-xvid*
            out/verification/video-tracks/legacy-mpeg2*
            out/verification/video-tracks/legacy-xvid*
            out/ci/mpeg2-xvid-fixtures.log
          if-no-files-found: error
          retention-days: 90
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: ${{ !cancelled() && (steps.avi-adpcm-fixtures.outcome == 'success' || steps.avi-adpcm-fixtures.outcome == 'failure') }}
        with:
          name: avi-adpcm-fixture-evidence
          path: |
            out/verification/video-tracks/avi-adpcm*
            out/verification/video-tracks/legacy-msvideo1*
            out/verification/video-tracks/legacy-div3*
            out/ci/avi-adpcm-fixtures.log
          if-no-files-found: error
          retention-days: 90
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: ${{ !cancelled() && (steps.dvd-audio-fixtures.outcome == 'success' || steps.dvd-audio-fixtures.outcome == 'failure') }}
        with:
          name: dvd-audio-fixture-evidence
          path: |
            out/verification/video-tracks/dvd-audio*
            out/verification/video-tracks/legacy-bilingual*
            out/ci/dvd-audio-fixtures.log
          if-no-files-found: error
          retention-days: 90
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: ${{ !cancelled() && (steps.large-dib-fixtures.outcome == 'success' || steps.large-dib-fixtures.outcome == 'failure') }}
        with:
          name: large-dib-fixture-evidence
          path: |
            out/verification/video-tracks/large-dib*
            out/verification/video-tracks/legacy-large-dib*
            out/ci/large-dib-fixtures.log
          if-no-files-found: error
          retention-days: 90
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: ${{ !cancelled() && (steps.long-vorbis-fixture.outcome == 'success' || steps.long-vorbis-fixture.outcome == 'failure') }}
        with:
          name: long-vorbis-fixture-evidence
          path: out/verification/long-vorbis/
          if-no-files-found: error
          retention-days: 90
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: ${{ !cancelled() && (steps.vorbis-speakers.outcome == 'success' || steps.vorbis-speakers.outcome == 'failure') }}
        with:
          name: vorbis-speaker-reference
          path: |
            out/verification/vorbis-speakers/
            out/ci/vorbis-speakers.log
          if-no-files-found: error
          retention-days: 90
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: ${{ !cancelled() && (steps.clone-cd-game.outcome == 'success' || steps.clone-cd-game.outcome == 'failure') }}
        with:
          name: clone-cd-game-reference
          path: out/verification/clone-cd-game/
          if-no-files-found: error
          retention-days: 90
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: ${{ !cancelled() && steps.legacy-fixtures.outcome == 'failure' }}
        with:
          name: legacy-fixture-evidence
          path: |
            out/verification/video-tracks/legacy*.log
            out/verification/video-tracks/legacy-video-reference.json
            out/verification/video-tracks/legacy*.mpg
            out/verification/video-tracks/legacy*.avi
            out/verification/video-tracks/legacy*.mpv
            out/verification/video-tracks/legacy*.m1v
            out/verification/video-tracks/legacy-authored.*
          if-no-files-found: error
          retention-days: 90
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: ${{ !cancelled() && (steps.cdda-aiff-fixtures.outcome == 'success' || steps.cdda-aiff-fixtures.outcome == 'failure') }}
        with:
          name: cdda-aiff-fixture-evidence
          path: |
            out/verification/cdda-aiff/
            out/ci/cdda-aiff.log
          if-no-files-found: error
          retention-days: 90

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: ${{ !cancelled() && (steps.disc-volumes.outcome == 'success' || steps.disc-volumes.outcome == 'failure') }}
        with:
          name: disc-volume-fixtures
          path: |
            out/verification/disc-volumes/
            !out/verification/disc-volumes/boot-udf201-sparable-source.iso
            !out/verification/disc-volumes/udf-sparable-manifest.json
            !out/verification/disc-volumes/udf-sparable-logs/
            !out/verification/disc-volumes/boot-udf250-metadata-source.iso
            !out/verification/disc-volumes/udf-metadata-manifest.json
            !out/verification/disc-volumes/boot-udf250-bridge-source.iso
            !out/verification/disc-volumes/udf-bridge-manifest.json
          if-no-files-found: error
          retention-days: 90

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: ${{ !cancelled() && (steps.udf-sparable-disc.outcome == 'success' || steps.udf-sparable-disc.outcome == 'failure') }}
        with:
          name: udf-sparable-disc
          path: |
            out/verification/disc-volumes/boot-udf201-sparable-source.iso
            out/verification/disc-volumes/udf-sparable-manifest.json
            out/verification/disc-volumes/udf-sparable-logs/
            out/ci/udf-sparable-disc.log
          if-no-files-found: error
          retention-days: 90

  deflate64-fixture-result:
    name: Independent Deflate64 fixture verification
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require complete 7-Zip games and multi-window reference
        env:
          FIXTURE_OUTCOME: ${{ needs.build.outputs.deflate64-fixtures }}
        run: test "$FIXTURE_OUTCOME" = success

  long-vorbis-fixture-result:
    name: Independent long Vorbis music fixture verification
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: Require the full long music reference
        env:
          FIXTURE_OUTCOME: ${{ needs.build.outputs.long-vorbis-fixture }}
        run: test "$FIXTURE_OUTCOME" = success

  cdda-aiff-fixture-result:
    name: Independent AIFF track and UDF game disc verification
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Require independently decoded AIFF disc tracks
        env:
          FIXTURE_OUTCOME: ${{ needs.build.outputs.cdda-aiff-fixtures }}
        run: test "$FIXTURE_OUTCOME" = success
      - name: Require both UDF game discs and their kernel and 7-Zip readbacks
        if: ${{ !cancelled() }}
        env:
          FIXTURE_OUTCOME: ${{ needs.build.outputs.udf-discs }}
        run: test "$FIXTURE_OUTCOME" = success
      - name: Require the relocated sparable DVD-RW and its independent kernel readback
        if: ${{ !cancelled() }}
        env:
          FIXTURE_OUTCOME: ${{ needs.build.outputs.udf-sparable-disc }}
        run: test "$FIXTURE_OUTCOME" = success

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        if: ${{ !cancelled() }}
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        if: ${{ !cancelled() }}
        with:
          node-version: '24.19.0'
          cache: npm
      - if: ${{ !cancelled() }}
        run: npm ci
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        if: ${{ !cancelled() }}
        with:
          name: udf-metadata-disc
          path: out/verification/disc-volumes
      - name: Verify paths, file bytes and metadata mirror recovery
        if: ${{ !cancelled() }}
        run: node --import tsx --test tests/conformance/udf.test.ts tests/conformance/udf-metadata-game.test.ts

  legacy-fixture-result:
    name: Independent legacy movie fixture verification
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: Require complete legacy movie references
        env:
          FIXTURE_OUTCOME: ${{ needs.build.outputs.legacy-fixtures }}
        run: test "$FIXTURE_OUTCOME" = success
      - name: Require complete Windows Media references
        if: ${{ !cancelled() }}
        env:
          FIXTURE_OUTCOME: ${{ needs.build.outputs.windows-media-fixtures }}
        run: test "$FIXTURE_OUTCOME" = success
      - name: Require QuickTime fixtures and both Windows-authored movies with their independent readbacks
        if: ${{ !cancelled() }}
        env:
          WMV9_RESULT: ${{ needs.build.outputs.wmv9-readback }}
          VC1_RESULT: ${{ needs.build.outputs.vc1-readback }}
          QUICKTIME_RESULT: ${{ needs.build.outputs.quicktime-fixtures }}
        run: test "$WMV9_RESULT" = success && test "$VC1_RESULT" = success && test "$QUICKTIME_RESULT" = success
      - name: Require complete MPEG-2 and Xvid references
        if: ${{ !cancelled() }}
        env:
          FIXTURE_OUTCOME: ${{ needs.build.outputs.mpeg2-xvid-fixtures }}
        run: test "$FIXTURE_OUTCOME" = success
      - name: Require complete MS Video 1 and DivX 3 AVI/ADPCM references
        if: ${{ !cancelled() }}
        env:
          FIXTURE_OUTCOME: ${{ needs.build.outputs.avi-adpcm-fixtures }}
        run: test "$FIXTURE_OUTCOME" = success
      - name: Require complete bilingual MPEG audio references
        if: ${{ !cancelled() }}
        env:
          FIXTURE_OUTCOME: ${{ needs.build.outputs.dvd-audio-fixtures }}
        run: test "$FIXTURE_OUTCOME" = success
      - name: Require a large AVI with independently verified late frames
        if: ${{ !cancelled() }}
        env:
          FIXTURE_OUTCOME: ${{ needs.build.outputs.large-dib-fixtures }}
        run: test "$FIXTURE_OUTCOME" = success

  cutscene-conversion:
    name: Check WMV, VC-1, QuickTime and MPEG-4 Part 2 cutscenes after WebAssembly conversion
    needs: [build, legacy-media-kernel]
    if: ${{ !cancelled() && needs.legacy-media-kernel.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.19.0'
          cache: npm
      - run: npm ci
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: legacy-media-kernel
          path: ${{ runner.temp }}/krkr-legacy-media
      - run: tar -xzf "$RUNNER_TEMP/krkr-legacy-media/legacy-media-kernel.tar.gz"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: independent-cutscene-readback
          path: out/verification/video-tracks
      - name: Check original movie routing and decode each converted MP4 with the system reader
        run: |
          mkdir -p out/ci
          node --import tsx --test --test-name-pattern='Windows Media 9|VC-1 Advanced Profile|QuickTime' tests/conformance/legacy-media.test.ts tests/conformance/legacy-video-port.test.ts 2>&1 | tee out/ci/cutscene-comparison.log
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: ${{ !cancelled() }}
        with:
          name: cutscene-conversion
          path: out/ci/
          retention-days: 90

  game-loading-and-playback:
    name: Game disc loading, focus and Wave playback
    if: ${{ !inputs.runtime-only }}
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/prepare-tests
        id: prepare
      - name: Check localized game inputs, focus results and streamed sound
        run: |
          node --import tsx --test --test-concurrency=2 --test-reporter=tap \
            tests/conformance/windows-korean-text.test.ts tests/conformance/legacy-zip-names.test.ts \
            tests/conformance/audio-source-play.test.ts tests/conformance/audio-source-seek.test.ts \
            tests/conformance/audio-wave-reopen.test.ts \
            tests/integration/boot-disc-range.test.ts tests/integration/layer-focus-result.test.ts \
            tests/integration/wave-source-seek.test.ts tests/integration/wave-source-play.test.ts | tee out/ci/game-loading-and-playback.tap
      - name: Check game scripts against their selected Windows code pages
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' }}
        run: |
          node --import tsx --test --test-reporter=tap --test-name-pattern='startup, chapter and compiled scripts before a game sets its decoder' \
            tests/integration/scripts.test.ts | tee out/ci/game-script-encoding.tap
      - name: Check Vorbis speaker routing against the independent mix
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' }}
        run: |
          node --import tsx --test --test-concurrency=2 --test-reporter=tap \
            tests/conformance/vorbis-speakers.test.ts tests/integration/vorbis-speakers.test.ts | tee out/ci/game-vorbis-speakers.tap
      - name: Open a device file and continue saving in the game directory
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' }}
        run: |
          node --import tsx --test --test-reporter=tap --test-name-pattern=device-picked \
            tests/integration/storage-selector.test.ts | tee out/ci/game-device-files.tap
      - name: Check CloneCD game tracks, playback and disc changes
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' }}
        run: |
          node --import tsx --test --test-concurrency=2 --test-reporter=tap \
            tests/conformance/clone-cd.test.ts tests/integration/clone-cd.test.ts | tee out/ci/game-clone-cd.tap
      - name: Check click coordinates and movie pause events
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' }}
        run: |
          node --import tsx --test --test-concurrency=2 --test-reporter=tap \
            tests/integration/mouse-click-origin.test.ts tests/conformance/video-first-frame-recovery.test.ts | tee out/ci/game-mouse-and-movie.tap
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: ${{ always() }}
        with:
          name: game-loading-and-playback
          path: |
            out/ci/game-*.tap
            out/ci/vorbis-speakers/
          if-no-files-found: warn
          retention-days: 90

  node:
    name: Node conformance and integration
    if: ${{ !inputs.runtime-only }}
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/prepare-tests
        id: prepare
      - name: Preserve native process crash diagnostics
        run: |
          # Installing gdb after a crash can upgrade libc and make the core's
          # build IDs disagree with the libraries used to read its backtrace.
          sudo apt-get update
          sudo apt-get install -y gdb
          gdb --version > out/ci/gdb-version.txt
          dpkg-query -W libc6 gdb > out/ci/node-debug-packages.txt
          ldd "$(command -v node)" > out/ci/node-linked-libraries.txt
          mkdir -p out/native-cores
          sudo sysctl -w "kernel.core_pattern=$GITHUB_WORKSPACE/out/native-cores/core.%e.%p" > out/ci/core-pattern.log
      - name: Install the independent media decoder
        run: sudo apt-get install -y ffmpeg
      - name: Run Node tests
        run: |
          ulimit -c unlimited
          node --import tsx --import ./scripts/record-node-test-process.mjs --test \
            --test-reporter=spec --test-reporter-destination=stdout \
            --test-reporter=tap --test-reporter-destination=out/ci/node.tap \
            --test-reporter=./scripts/record-node-test-events.mjs --test-reporter-destination=stdout \
            tests/conformance/*.test.ts tests/integration/*.test.ts 2>&1 | tee out/ci/node.log
      - name: Check variant pool reclamation through the JSPI kernel
        if: ${{ always() && steps.prepare.outcome == 'success' }}
        env:
          KRKR_VARIANT_STACK_VARIANT: jspi
        run: |
          ulimit -c unlimited
          node --experimental-wasm-jspi --import tsx --import ./scripts/record-node-test-process.mjs --test \
            --test-reporter=spec --test-reporter-destination=stdout \
            --test-reporter=tap --test-reporter-destination=out/ci/variant-stack-jspi.tap \
            tests/conformance/variant-stack.test.ts 2>&1 | tee out/ci/variant-stack-jspi.log
      - name: Check native random entropy and state through the JSPI kernel
        if: ${{ always() && steps.prepare.outcome == 'success' }}
        env:
          KRKR_RANDOM_VARIANT: jspi
        run: |
          ulimit -c unlimited
          node --experimental-wasm-jspi --import tsx --import ./scripts/record-node-test-process.mjs --test \
            --test-reporter=spec --test-reporter-destination=stdout \
            --test-reporter=tap --test-reporter-destination=out/ci/random-generator-jspi.tap \
            tests/conformance/random-generator.test.ts 2>&1 | tee out/ci/random-generator-jspi.log
      - name: Check native TVP messages through the JSPI kernel
        if: ${{ always() && steps.prepare.outcome == 'success' }}
        env:
          KRKR_MESSAGES_VARIANT: jspi
        run: |
          ulimit -c unlimited
          node --experimental-wasm-jspi --import tsx --import ./scripts/record-node-test-process.mjs --test \
            --test-reporter=spec --test-reporter-destination=stdout \
            --test-reporter=tap --test-reporter-destination=out/ci/tvp-messages-jspi.tap \
            tests/conformance/tvp-messages.test.ts 2>&1 | tee out/ci/tvp-messages-jspi.log
      - name: Check native container factory retirement through the JSPI kernel
        if: ${{ always() && steps.prepare.outcome == 'success' }}
        env:
          KRKR_CONTAINER_VARIANT: jspi
        run: |
          ulimit -c unlimited
          node --experimental-wasm-jspi --import tsx --import ./scripts/record-node-test-process.mjs --test \
            --test-reporter=spec --test-reporter-destination=stdout \
            --test-reporter=tap --test-reporter-destination=out/ci/native-container-factories-jspi.tap \
            tests/conformance/native-container-factories.test.ts 2>&1 | tee out/ci/native-container-factories-jspi.log
      - name: Check the JSPI MIDI octet capability before VM creation
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' }}
        env:
          KRKR_MIDI_VARIANT: jspi
        run: |
          node --experimental-wasm-jspi --import tsx --test --test-name-pattern='native MIDI octet support' \
            --test-reporter=tap tests/conformance/midi-output.test.ts | tee out/ci/midi-output-jspi.tap
      - name: Record backtraces for any terminated Node process
        if: always()
        run: |
          if compgen -G 'out/native-cores/core.*' > /dev/null; then
            mkdir -p out/ci/node-crashes
            for core in out/native-cores/core.*; do
              sha256sum "$core" >> out/ci/node-crashes/core-sha256.txt
              gdb --batch -ex 'set pagination off' -ex 'thread apply all bt' "$(command -v node)" "$core" > "out/ci/node-crashes/$(basename "$core").backtrace" 2>&1 || true
            done
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: node-results
          path: out/ci/
          retention-days: 90
      - name: Preserve original Node core bytes
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: node-native-cores
          path: out/native-cores/
          if-no-files-found: ignore
          retention-days: 90

  browser:
    name: Browser / ${{ matrix.browser }} / ${{ matrix.batch.suite }}${{ matrix.batch.shardIndex && format(' / shard {0}/{1}', matrix.batch.shardIndex, matrix.batch.shardTotal) || '' }} (${{ matrix.os }})
    if: ${{ !inputs.node-only && !inputs.runtime-only }}
    needs: build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      KRKR_TEST_HEADED: ${{ matrix.headed }}
      KRKR_TEST_BROWSER: ${{ matrix.browser }}
      KRKR_TEST_SUITE: ${{ matrix.batch.suite }}
      KRKR_TEST_WORKERS: ${{ matrix.workers }}
      KRKR_TEST_SHARD_INDEX: ${{ matrix.batch.shardIndex || '' }}
      KRKR_TEST_SHARD_TOTAL: ${{ matrix.batch.shardTotal || '' }}
      LIBGL_ALWAYS_SOFTWARE: '1'
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
        batch:
          - { suite: browser, shardIndex: '1', shardTotal: '4' }
          - { suite: browser, shardIndex: '2', shardTotal: '4' }
          - { suite: browser, shardIndex: '3', shardTotal: '4' }
          - { suite: browser, shardIndex: '4', shardTotal: '4' }
          - { suite: library }
          - { suite: pwa }
        include:
          - browser: chromium
            os: ubuntu-24.04
            headed: '0'
            workers: '2'
          - browser: firefox
            os: ubuntu-24.04
            headed: '1'
            workers: '1'
          - browser: webkit
            os: macos-15
            headed: '0'
            workers: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Mark this hosted macOS job before starting any browsers
        if: runner.os == 'macOS' && runner.environment == 'github-hosted'
        run: |
          mkdir -p out/ci
          touch out/ci/native-reports-start.marker
          date -u '+%Y-%m-%dT%H:%M:%SZ' > out/ci/native-reports-start.txt
      - uses: ./.github/actions/prepare-tests
      - name: Record browser job and shared build identity
        run: |
          node --input-type=module <<'JS'
          import { readFileSync, writeFileSync } from 'node:fs'
          const project = process.env.KRKR_TEST_BROWSER
          const suite = process.env.KRKR_TEST_SUITE
          const index = process.env.KRKR_TEST_SHARD_INDEX
          const total = process.env.KRKR_TEST_SHARD_TOTAL
          const validShard = suite === 'browser'
            ? ['1', '2', '3', '4'].includes(index) && total === '4'
            : !index && !total
          if (!validShard) {
            throw new Error('Unexpected browser shard selection')
          }
          writeFileSync('out/ci/browser-job.json', JSON.stringify({
            commit: process.env.GITHUB_SHA,
            runId: process.env.GITHUB_RUN_ID,
            attempt: process.env.GITHUB_RUN_ATTEMPT,
            project,
            suite,
            shard: index ? `${index}/${total}` : null,
            shardIndex: index ? Number(index) : null,
            shardTotal: total ? Number(total) : null,
            workers: Number(process.env.KRKR_TEST_WORKERS),
            headed: process.env.KRKR_TEST_HEADED === '1',
            displayIsolation: process.env.KRKR_TEST_HEADED === '1' ? 'one-worker-per-hosted-display' : 'headless',
            build: JSON.parse(readFileSync('out/ci/build-info.json', 'utf8')),
          }, null, 2) + '\n')
          JS
      - name: Install browser and system dependencies
        id: browser-install
        run: npx playwright install --with-deps "${{ matrix.browser }}"
      - name: Install virtual display, graphics and audio output
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y xvfb x11-utils libgl1-mesa-dri mesa-utils pulseaudio pulseaudio-utils
          xvfb-run -a glxinfo -B
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=krkr_test_output rate=48000 channels=2
          pactl set-default-sink krkr_test_output
          pactl info
      - name: Verify Worker graphics before running game scenarios
        id: graphics
        run: bash scripts/ci-browser.sh node --import tsx tests/probes/browser-capabilities.ts "${{ matrix.browser }}" 2>&1 | tee out/ci/capabilities.log
      - name: Run browser suite
        env:
          # Correlate Firefox display failures and WebKit page crashes with native
          # process lifetimes; test deadlines and retry settings stay fixed.
          DEBUG: ${{ matrix.browser != 'chromium' && 'pw:browser' || '' }}
          PLAYWRIGHT_JSON_OUTPUT_NAME: out/ci/results.json
        run: |
          case "$KRKR_TEST_SUITE" in
            browser) krkr_playwright_config=playwright.config.ts ;;
            library) krkr_playwright_config=playwright.library.config.ts ;;
            pwa) krkr_playwright_config=playwright.pwa.config.ts ;;
            *) exit 1 ;;
          esac
          krkr_shard_args=()
          if [[ -n "$KRKR_TEST_SHARD_INDEX" ]]; then
            krkr_shard_args=("--shard=$KRKR_TEST_SHARD_INDEX/$KRKR_TEST_SHARD_TOTAL")
          fi
          bash scripts/ci-browser.sh npx playwright test -c "$krkr_playwright_config" \
            --project="$KRKR_TEST_BROWSER" --workers="$KRKR_TEST_WORKERS" \
            "${krkr_shard_args[@]}" --reporter=list,json,github 2>&1 | tee out/ci/results.log
      - name: Preserve new hosted macOS browser crash reports
        if: ${{ always() && runner.os == 'macOS' && runner.environment == 'github-hosted' }}
        run: |
          python3 - <<'PY'
          import datetime
          import hashlib
          import json
          import os
          import pathlib
          import platform
          import shutil
          import time

          # Never inspect a developer's Mac or a self-hosted runner.
          if (os.environ.get('GITHUB_ACTIONS') != 'true' or
                  os.environ.get('RUNNER_ENVIRONMENT') != 'github-hosted' or
                  platform.system() != 'Darwin'):
              raise SystemExit('Native report collection requires a GitHub-hosted Mac')
          output = pathlib.Path('out/ci/native-crashes')
          output.mkdir(parents=True, exist_ok=True)
          marker = pathlib.Path('out/ci/native-reports-start.marker')
          manifest = {
              'runId': os.environ.get('GITHUB_RUN_ID'),
              'attempt': os.environ.get('GITHUB_RUN_ATTEMPT'),
              'commit': os.environ.get('GITHUB_SHA'),
              'browser': os.environ.get('KRKR_TEST_BROWSER'),
              'suite': os.environ.get('KRKR_TEST_SUITE'),
              'shardIndex': os.environ.get('KRKR_TEST_SHARD_INDEX') or None,
              'shardTotal': os.environ.get('KRKR_TEST_SHARD_TOTAL') or None,
              'jobStarted': marker.exists(),
              'scope': 'New browser-related report candidates; correlate crash time and PID with Playwright logs',
              'roots': [], 'reports': [], 'errors': [], 'unrelatedNewReports': 0,
          }
          if marker.exists():
              started = marker.stat().st_mtime_ns
              manifest['markerMtimeNs'] = started
              # Allow ReportCrash a bounded interval to finish writing. An empty
              # result after this interval does not establish that no crash occurred.
              time.sleep(3)
              keywords = (b'webkit', b'webcontent', b'minibrowser', b'playwright',
                          b'javascriptcore', b'webprocess')
              manifest['matchKeywords'] = [word.decode() for word in keywords]
              for label, root in [
                  ('user', pathlib.Path.home() / 'Library/Logs/DiagnosticReports'),
                  ('system', pathlib.Path('/Library/Logs/DiagnosticReports')),
              ]:
                  manifest['roots'].append({'label': label, 'path': str(root), 'exists': root.exists()})
                  if not root.exists():
                      continue
                  try:
                      for report in root.rglob('*'):
                          if report.suffix.lower() not in ('.ips', '.crash') or not report.is_file():
                              continue
                          try:
                              info = report.stat()
                              birth = int(info.st_birthtime * 1_000_000_000)
                              if birth < started or info.st_mtime_ns < started:
                                  continue
                              payload = report.read_bytes()
                              candidate = report.name.encode().lower() + b'\n' + payload.lower()
                              matches = [word.decode() for word in keywords if word in candidate]
                              if not matches:
                                  manifest['unrelatedNewReports'] += 1
                                  continue
                              target = output / label / report.relative_to(root)
                              target.parent.mkdir(parents=True, exist_ok=True)
                              target.write_bytes(payload)
                              shutil.copystat(report, target)
                              manifest['reports'].append({
                                  'source': str(report), 'artifactPath': str(target),
                                  'size': len(payload), 'mtimeNs': info.st_mtime_ns,
                                  'birthtimeNs': birth, 'matchedKeywords': matches,
                                  'sha256': hashlib.sha256(payload).hexdigest(),
                              })
                          except OSError as error:
                              manifest['errors'].append({'path': str(report), 'error': str(error)})
                  except OSError as error:
                      manifest['errors'].append({'path': str(root), 'error': str(error)})
          manifest['collectedAt'] = datetime.datetime.now(datetime.timezone.utc).isoformat()
          (output / 'manifest.json').write_text(json.dumps(manifest, indent=2) + '\n')
          print(json.dumps(manifest, indent=2))
          if manifest['errors']:
              raise SystemExit('Some new native diagnostic reports could not be preserved')
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: browser-results-${{ matrix.browser }}-${{ matrix.batch.suite }}${{ matrix.batch.shardIndex && format('-shard-{0}-of-{1}', matrix.batch.shardIndex, matrix.batch.shardTotal) || '' }}
          path: |
            out/ci/
            test-results/
            out/verification/graphics/
          retention-days: 90

  native-activity:
    name: Chromium trusted lifecycle
    if: ${{ !inputs.node-only && !inputs.runtime-only }}
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/prepare-tests
      - run: npx playwright install --with-deps chromium
      - name: Run native visibility and freeze tests
        run: npx playwright test -c playwright.activity.config.ts 2>&1 | tee out/ci/native-activity.log
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: native-activity-results
          path: |
            out/ci/
            out/verification/activity/native-check.json
            test-results-native-activity/
          retention-days: 90

  runtime:
    name: Direct runtime / three browsers
    if: ${{ !inputs.node-only }}
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/prepare-tests
      - run: npx playwright install --with-deps chromium firefox webkit
      - name: Run direct compile, dump, exception and cancellation probes
        run: node --import tsx tests/probes/vm-runtime-browser.ts 2>&1 | tee out/ci/runtime.log
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: runtime-results
          path: |
            out/ci/
            out/verification/vm-console/
          retention-days: 90

  compatibility:
    name: Original KAG and release compatibility
    if: ${{ !inputs.node-only && !inputs.runtime-only }}
    needs: build
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/compatibility.yml

  tests:
    name: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[application tests]') && 'Application and compatibility tests' || 'All tests' }}
    if: ${{ always() && !inputs.node-only && !inputs.runtime-only }}
    needs: [build, tools-types, udf-metadata-disc, windows-media9-originals, cutscene-conversion, wave-speaker-reference, legacy-fixture-result, deflate64-fixture-result, long-vorbis-fixture-result, cdda-aiff-fixture-result, game-loading-and-playback, node, browser, native-activity, runtime, compatibility, identity-allocations, cursor-reference, window-move-reference, window-geometry-reference, termination-reference, variant-stack-reference, lifetime-runtime-reference, menu-lifetime-runtime-reference, activity-wrapper-runtime-reference, png-kernel, png-lowbit, png-reference, png-stream-comparison, png-palette-comparison, jpeg-fixtures, jpeg-kernel, jpeg-reference, jpeg-comparison, legacy-media-kernel, eri-reference, original-sound-wine, kag-bookmarks, native-save-transfer, native-player-config, original-disc-search]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every job to pass
        env:
          RESULTS: ${{ toJSON(needs) }}
          APPLICATION_TESTS: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[application tests]') }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          results = json.loads(os.environ['RESULTS'])
          historical_diagnostics = {
              'lifetime-runtime-reference', 'menu-lifetime-runtime-reference', 'activity-wrapper-runtime-reference'
          } if os.environ['APPLICATION_TESTS'] == 'true' else set()
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('| Job | Result |\n| --- | --- |\n')
              for name, job in results.items():
                  summary.write(f"| {name} | {job['result']} |\n")
          sys.exit(0 if all(job['result'] == ('skipped' if name in historical_diagnostics else 'success')
                            for name, job in results.items()) else 1)
          PY

  identity-allocations:
    name: Native object identity allocation failures
    if: ${{ !inputs.node-only && !inputs.runtime-only }}
    uses: ./.github/workflows/object-identity-allocations.yml

  cursor-reference:
