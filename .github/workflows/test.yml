  menu-lifetime-runtime-reference:
    name: Menu lifetime host runtime diagnosis
    if: ${{ !inputs.node-only && !inputs.runtime-only && !(github.event_name == 'push' && contains(github.event.head_commit.message, '[application tests]')) }}
    needs: build
    uses: ./.github/workflows/menu-lifetime-runtime.yml

  activity-wrapper-runtime-reference:
    name: Fixed batch111 activity wrapper runtime diagnosis
    if: ${{ !inputs.node-only && !inputs.runtime-only && !(github.event_name == 'push' && contains(github.event.head_commit.message, '[application tests]')) }}
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/activity-wrapper-runtime.yml

  png-reference:
    name: Fixed libpng 1.0.6 loader reference
    if: ${{ !inputs.node-only && !inputs.runtime-only }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the original-width C and zlib build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-multilib lib32z1-dev
      - name: Compile pinned libpng sources and record original loader calls
        run: python3 scripts/run-native-png-reference.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: native-png-reference
          path: out/verification/native-png/
          if-no-files-found: error
          retention-days: 90

  png-lowbit:
    name: Independent selected PNG low-bit and transparency contracts
    if: ${{ !inputs.runtime-only }}
    needs: png-kernel
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/prepare-tests
        with:
          image-kernel: zlib
      - name: Run all eight definitions with this run's production inflater
        run: |
          mkdir -p out/verification/png-lowbit
          cp .generated/image-zlib/manifest.json out/verification/png-lowbit/kernel-manifest.json
          node --import tsx --test --test-reporter=tap tests/conformance/png-lowbit.test.ts 2>&1 | tee out/verification/png-lowbit/node.tap
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: png-lowbit-results
          path: out/verification/png-lowbit/
          if-no-files-found: error
          retention-days: 90

  png-stream-comparison:
    name: PNG pull decoder and native write phases
    if: ${{ !inputs.node-only && !inputs.runtime-only }}
    needs: [png-kernel, png-reference]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/prepare-tests
        with:
          image-kernel: zlib
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: native-png-reference
          path: out/verification/native-png/
      - name: Compare full destination bytes and actual completion phases
        run: node --import tsx tests/probes/png-stream-compare.ts out/verification/native-png
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: png-stream-comparison
          path: out/verification/png-stream-comparison/
          if-no-files-found: error
          retention-days: 90

  png-palette-comparison:
    name: PNG palette transforms and native row layout
    if: ${{ !inputs.node-only && !inputs.runtime-only }}
    needs: [png-kernel, png-reference]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/prepare-tests
        with:
          image-kernel: zlib
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: native-png-reference
          path: out/verification/native-png/
      - name: Compare defined palette output bytes and safe initialized tails
        run: node --import tsx tests/probes/png-palette-compare.ts out/verification/native-png
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: png-palette-comparison
          path: out/verification/png-palette-comparison/
          if-no-files-found: error
          retention-days: 90

  jpeg-reference:
    name: Fixed IJG 6b original JPEG handler reference
    if: ${{ !inputs.node-only && !inputs.runtime-only }}
    needs: jpeg-fixtures
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: jpeg-fixtures
          path: out/verification/jpeg-fixtures/
      - name: Execute the pinned original JPEG call order
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-multilib
          python3 scripts/run-native-jpeg-reference.py --reference out/verification/jpeg-fixtures --output out/verification/native-jpeg
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: native-jpeg-reference
          path: out/verification/native-jpeg/
          if-no-files-found: error
          retention-days: 90

  original-sound-wine:
    name: Original SDK sound with a software audio endpoint (Wine)
    if: ${{ !inputs.node-only && !inputs.runtime-only }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.19.0'
          cache: npm
      - run: npm ci
      - name: Prepare the same SLI and WAVE project as the Windows comparison
        id: prepare_sound
        run: node --import tsx tests/probes/sli-sdk.ts prepare --wine-pulse
      - name: Start a 32-bit Wine environment and a stereo output device
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends wine wine32:i386 libpulse0:i386 pulseaudio pulseaudio-utils xvfb xauth
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=krkr_sdk_output rate=48000 channels=2
          pactl set-default-sink krkr_sdk_output
          pactl info > out/verification/original-sound-wine/pulse-info.txt
      - name: Run the original engine against the software output
        run: xvfb-run -a python3 tests/probes/original-sound-wine.py
      - name: Compare the original script observations
        if: ${{ !cancelled() && steps.prepare_sound.outcome == 'success' }}
        run: node --import tsx tests/probes/sli-sdk.ts compare --wine-pulse
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: original-sound-wine
          path: out/verification/original-sound-wine/
          if-no-files-found: error
          retention-days: 90

  eri-reference:
    name: Original 2.32r2 SDK ERI pixels (${{ matrix.corpus }})
    if: ${{ !inputs.node-only && !inputs.runtime-only }}
    runs-on: windows-2022
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - corpus: authored
            artifact: original-eri-reference
          - corpus: encoder
            artifact: original-eri-encoder-reference
          - corpus: dct
            artifact: original-eri-dct-reference
    env:
      KRKR_ERI_CORPUS: ${{ matrix.corpus }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.19.0'
          cache: npm
      - id: install_eri_reference
        run: npm ci
      - name: Prepare the owned image fixtures and record input hashes
        id: prepare_eri
        run: node --import tsx tests/probes/eri-sdk.ts prepare
      - name: Observe the original SDK with the fixed ERI project
        run: ./tests/probes/original-eri.ps1
      - name: Compare every native observation with the selected Web image loader
        if: ${{ !cancelled() && steps.prepare_eri.outcome == 'success' }}
        run: node --import tsx tests/probes/eri-sdk.ts compare
      - name: Run the portable ERI contracts against the same checkout
        if: ${{ !cancelled() && matrix.corpus == 'authored' && steps.prepare_eri.outcome == 'success' }}
        run: |
          node --import tsx --test --test-reporter=tap tests/conformance/eri-native.test.ts tests/conformance/eri-truecolor.test.ts tests/conformance/eri-huffman.test.ts tests/conformance/eri-arithmetic.test.ts tests/conformance/eri-dct.test.ts |
            Tee-Object -FilePath out/verification/native-eri/conformance.tap
          exit $LASTEXITCODE
      - name: Prepare Window posted key and mouse observations
        id: prepare_window_input
        if: ${{ !cancelled() && matrix.corpus == 'authored' && steps.install_eri_reference.outcome == 'success' }}
        run: node --import tsx tests/probes/window-post-input-sdk.ts prepare
      - name: Deliver posted input through the original game window
        if: ${{ !cancelled() && steps.prepare_window_input.outcome == 'success' }}
        run: ./tests/probes/original-eri.ps1 -Project window-input
      - name: Compare posted key and mouse observations
        if: ${{ !cancelled() && steps.prepare_window_input.outcome == 'success' }}
        run: node --import tsx tests/probes/window-post-input-sdk.ts compare
      - name: Prepare original TJS decimal and saved-value controls
        id: prepare_decimal
        if: ${{ !cancelled() && matrix.corpus == 'authored' && steps.install_eri_reference.outcome == 'success' }}
        run: node --import tsx tests/probes/decimal-sdk.ts prepare
      - name: Read game decimal constants on the original Windows engine
        if: ${{ !cancelled() && steps.prepare_decimal.outcome == 'success' }}
        run: ./tests/probes/original-eri.ps1 -Project decimal
      - name: Compare the exact real numbers saved by the original SDK
        if: ${{ !cancelled() && steps.prepare_decimal.outcome == 'success' }}
        run: node --import tsx tests/probes/decimal-sdk.ts native
      - name: Prepare MIDI open controls for the original SDK
        id: prepare_midi
        if: ${{ !cancelled() && matrix.corpus == 'authored' && steps.install_eri_reference.outcome == 'success' }}
        run: node --import tsx tests/probes/midi-sdk.ts prepare
      - name: Observe the original MIDI file and stream message holders
        if: ${{ !cancelled() && steps.prepare_midi.outcome == 'success' }}
        run: ./tests/probes/original-eri.ps1 -Project midi
      - name: Compare MIDI observations and run sequencer contracts
        if: ${{ !cancelled() && steps.prepare_midi.outcome == 'success' }}
        run: |
          node --import tsx tests/probes/midi-sdk.ts compare
          $comparison = $LASTEXITCODE
          node --import tsx --test --test-reporter=tap tests/conformance/midi-native.test.ts |
            Tee-Object -FilePath out/verification/native-eri/midi/conformance.tap
          if ($comparison -ne 0) { exit $comparison }
          exit $LASTEXITCODE
      - name: Prepare original KAG scenarios and bookmark controls
        if: ${{ !cancelled() && matrix.corpus == 'authored' && steps.install_eri_reference.outcome == 'success' }}
        id: prepare_kag
        run: node --import tsx tests/probes/kag-sdk.ts prepare
      - name: Read scenarios and save an active macro with the original KAG parser
        if: ${{ !cancelled() && steps.prepare_kag.outcome == 'success' }}
        run: ./tests/probes/original-eri.ps1 -Project kag
      - name: Preserve and compare native KAG control observations
        if: ${{ !cancelled() && steps.prepare_kag.outcome == 'success' }}
        run: node --import tsx tests/probes/kag-sdk.ts native
      - name: Prepare WaveSoundBuffer loop, label and WAVE format controls
        if: ${{ !cancelled() && matrix.corpus == 'authored' && steps.install_eri_reference.outcome == 'success' }}
        id: prepare_sli
        run: node --import tsx tests/probes/sli-sdk.ts prepare
      - name: Observe original SDK loop information, labels and WAVE opens
        if: ${{ !cancelled() && steps.prepare_sli.outcome == 'success' }}
        run: ./tests/probes/original-eri.ps1 -Project sli
      - name: Compare the SLI and WAVE format observations
        if: ${{ !cancelled() && steps.prepare_sli.outcome == 'success' }}
        run: node --import tsx tests/probes/sli-sdk.ts compare
      - name: Prepare a game window that records ordinary mouse clicks
        if: ${{ !cancelled() && matrix.corpus == 'authored' && steps.install_eri_reference.outcome == 'success' }}
        id: prepare_mouse_click
        run: node --import tsx tests/probes/mouse-click-sdk.ts prepare
      - name: Double-click the original game window and release the button at a different point
        if: ${{ !cancelled() && steps.prepare_mouse_click.outcome == 'success' }}
        run: ./tests/probes/original-eri.ps1 -Project mouse-click
      - name: Preserve the observed window and layer coordinates
        if: ${{ !cancelled() && steps.prepare_mouse_click.outcome == 'success' }}
        run: node --import tsx tests/probes/mouse-click-sdk.ts compare
      - name: Prepare safe original transition option controls
        if: ${{ !cancelled() && matrix.corpus == 'authored' && steps.install_eri_reference.outcome == 'success' }}
        id: prepare_transition
        run: node --import tsx tests/probes/transition-sdk.ts prepare
      - name: Observe original Layer transition option reads and errors
        if: ${{ !cancelled() && steps.prepare_transition.outcome == 'success' }}
        run: ./tests/probes/original-eri.ps1 -Project transition
      - name: Preserve and compare original transition option observations
        if: ${{ !cancelled() && steps.prepare_transition.outcome == 'success' }}
        run: node --import tsx tests/probes/transition-sdk.ts compare
      - name: Prepare literal alpha transition pixel controls
        if: ${{ !cancelled() && matrix.corpus == 'authored' && steps.install_eri_reference.outcome == 'success' }}
        id: prepare_transition_alpha
        run: node --import tsx tests/probes/transition-alpha-sdk.ts prepare
      - name: Observe original live alpha and PS transition pixels
        if: ${{ !cancelled() && steps.prepare_transition_alpha.outcome == 'success' }}
        run: ./tests/probes/original-eri.ps1 -Project transition-alpha
      - name: Preserve and compare original alpha transition pixels
        if: ${{ !cancelled() && steps.prepare_transition_alpha.outcome == 'success' }}
        run: node --import tsx tests/probes/transition-alpha-sdk.ts compare
      - name: Prepare the original KAG introduction and its layout observer
        if: ${{ !cancelled() && matrix.corpus == 'authored' && steps.install_eri_reference.outcome == 'success' }}
        id: prepare_kag_intro
        run: node --import tsx tests/probes/kag-intro-sdk.ts prepare
      - name: Observe the initial menu with the original Windows engine
        if: ${{ !cancelled() && steps.prepare_kag_intro.outcome == 'success' }}
        run: ./tests/probes/original-eri.ps1 -Project kag-intro
      - name: Preserve the first stable menu or page boundary and layout metrics
        if: ${{ !cancelled() && steps.prepare_kag_intro.outcome == 'success' }}
        run: node --import tsx tests/probes/kag-intro-sdk.ts native
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: ${{ matrix.artifact }}
          path: out/verification/native-eri/
          if-no-files-found: error
          retention-days: 90

  kag-bookmarks:
    name: Compare original game bookmarks, decimal saves and DCT pixels in the Web player
    needs: [build, eri-reference]
    if: ${{ !cancelled() && !inputs.node-only && !inputs.runtime-only && needs.build.result == 'success' && needs.eri-reference.result != 'skipped' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/prepare-tests
        id: prepare_sdk_consumers
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: original-eri-reference
          path: out/verification/native-eri
      - run: node --import tsx tests/probes/kag-sdk.ts web
      - name: Read original saved decimal values in source and bytecode Web sessions
        if: ${{ !cancelled() }}
        run: node --import tsx tests/probes/decimal-sdk.ts web
      - name: Install Chromium for the original SDK comparisons
        id: sdk_chromium
        if: ${{ !cancelled() && steps.prepare_sdk_consumers.outcome == 'success' }}
        run: npx playwright install --with-deps chromium
      - name: Restore the SDK bookmark through the Chromium player
        if: ${{ !cancelled() && steps.sdk_chromium.outcome == 'success' && hashFiles('out/verification/native-eri/kag/game/native-bookmark.tjs') != '' }}
        env:
          KRKR_KAG_SDK_IMPORT: '1'
          PLAYWRIGHT_JSON_OUTPUT_NAME: out/verification/kag-bookmark-browser/results.json
        run: npx playwright test tests/browser/kag-macro-bookmark.spec.ts --project=chromium --output=out/verification/kag-bookmark-browser --reporter=list,json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: original-kag-bookmark-comparison
          path: |
            out/verification/native-eri/kag
            out/verification/native-eri/decimal
            out/verification/kag-bookmark-browser
          if-no-files-found: error
          retention-days: 90

      - name: Fetch the same-commit Windows DCT input and original pixel observations
        id: download_dct
        if: ${{ !cancelled() }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: original-eri-dct-reference
          path: out/verification/sdk-dct
      - name: Display the author-encoded pictures in Chromium and compare original pixels
        if: ${{ !cancelled() && steps.download_dct.outcome == 'success' && steps.sdk_chromium.outcome == 'success' }}
        env:
          KRKR_DCT_SDK_IMPORT: '1'
          PLAYWRIGHT_JSON_OUTPUT_NAME: out/verification/dct-browser/results.json
        run: npx playwright test tests/browser/eri-sdk-pixels.spec.ts --project=chromium --output=out/verification/dct-browser --reporter=list,json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: ${{ !cancelled() && steps.download_dct.outcome == 'success' }}
        with:
          name: original-dct-browser-comparison
          path: out/verification/dct-browser/
          if-no-files-found: error
          retention-days: 90

  native-player-config:
    name: Original Windows external configuration and data directory
    if: ${{ !inputs.node-only && !inputs.runtime-only }}
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.19.0'
          cache: npm
      - run: npm ci
      - name: Prepare independent external configuration inputs
        id: prepare_config
        run: node --import tsx tests/probes/player-config-sdk.ts prepare
      - name: Observe stock and configured original engine processes
        shell: pwsh
        run: ./tests/probes/original-player-config.ps1
      - name: Read game-owned Windows registry settings in the stock player
        if: ${{ !cancelled() && steps.prepare_config.outcome == 'success' }}
        id: registry
        shell: pwsh
        run: ./tests/probes/game-registry.ps1
      - name: Read the exact Windows export in the Web registry reader
        if: ${{ !cancelled() && steps.registry.outcome == 'success' }}
        run: node --import tsx tests/probes/game-registry-export.ts
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: ${{ !cancelled() && (steps.registry.outcome == 'success' || steps.registry.outcome == 'failure') }}
        with:
          name: original-game-registry
          path: out/verification/native-eri/game-registry/
          if-no-files-found: error
          retention-days: 90
      - name: Compare argument precedence and the actual saved data paths
        if: ${{ !cancelled() && steps.prepare_config.outcome == 'success' }}
        run: node --import tsx tests/probes/player-config-sdk.ts compare
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: original-player-config
          path: out/verification/native-player-config/
          if-no-files-found: error
          retention-days: 90

  original-disc-search:
    name: Original Windows game reads mounted discs and KAG project files
    needs: build
    if: ${{ !inputs.node-only && !inputs.runtime-only }}
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: disc-volume-fixtures
          path: out/verification/disc-volumes
      - name: Compare original TJS drive lookup and argument handling with Windows
        shell: pwsh
        run: ./tests/probes/disc-volume.ps1
      - name: Read the boot disc project with the original KRKR2 runtime
        if: ${{ !cancelled() }}
        shell: pwsh
        run: ./tests/probes/disc-boot.ps1
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: original-disc-volume-search
          path: out/verification/native-eri/disc-volume/
          retention-days: 90
          if-no-files-found: error
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: original-disc-boot-project
          path: out/verification/native-eri/disc-boot/
          retention-days: 90
          if-no-files-found: error

  native-save-transfer:
    name: Original Windows player reads Web save ZIPs
    needs: build
    if: ${{ !inputs.node-only && !inputs.runtime-only }}
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.19.0'
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: test-build
          path: ${{ runner.temp }}/save-test-build
      - name: Restore the release kernels used to write the saves
        shell: pwsh
        run: |
          $bundle = Join-Path $env:RUNNER_TEMP 'save-test-build/test-build.tar.gz'
          tar.exe -xzf $bundle .generated/wasm .generated/image-jpeg .generated/image-zlib out/ci/build-info.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $build = Get-Content out/ci/build-info.json -Raw | ConvertFrom-Json
          if ($build.commit -cne $env:GITHUB_SHA -or $build.runId -ne $env:GITHUB_RUN_ID) { throw 'Mismatched save producer build' }
      - name: Export both game saves using this run's release WASM
        run: node --import tsx --test tests/integration/native-saves.test.ts
      - name: Preserve the two portable save ZIPs for stock KRKR2
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: web-native-saves
          path: out/ci/web-native-saves/
          if-no-files-found: error
          retention-days: 90
      - name: Extract the Web ZIPs as desktop save directories
        shell: pwsh
        run: |
          $root = 'out/verification/native-eri/player-saves'
          New-Item -ItemType Directory -Force "$root/web" | Out-Null
          foreach ($mode in 'source', 'bytecode') {
            Copy-Item -LiteralPath "out/ci/web-native-saves/$mode.zip","out/ci/web-native-saves/$mode.json" -Destination "$root/web/"
            $dest = Join-Path $root "game/$mode"
            New-Item -ItemType Directory -Force $dest | Out-Null
            Expand-Archive -LiteralPath "$root/web/$mode.zip" -DestinationPath $dest
          }
          node --import tsx tests/probes/native-save-transfer.ts prepare
      - name: Restore both bookmarks and display their thumbnails on the original SDK
        id: observe
        shell: pwsh
        run: ./tests/probes/original-eri.ps1 -Project player-saves
      - name: Compare original pixels, active macro and returned narrative positions
        if: ${{ !cancelled() && (steps.observe.outcome == 'success' || steps.observe.outcome == 'failure') }}
        run: node --import tsx tests/probes/native-save-transfer.ts compare
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: original-player-save-transfer
          path: out/verification/native-eri/player-saves/
          if-no-files-found: error
          retention-days: 90

  jpeg-comparison:
    name: JPEG native pixels, read phases and completed row groups
    if: ${{ !inputs.node-only && !inputs.runtime-only }}
    needs: [jpeg-kernel, jpeg-reference]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/prepare-tests
        with:
          image-kernel: jpeg
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: native-jpeg-reference
          path: out/verification/native-jpeg/
      - name: Compare every fixed-source JPEG reference
        run: node --import tsx tests/probes/jpeg-compare.ts out/verification/native-jpeg
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: jpeg-comparison
          path: out/verification/jpeg-comparison/
          if-no-files-found: error
          retention-days: 90
