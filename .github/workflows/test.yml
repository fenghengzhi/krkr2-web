name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  CI: 'true'

jobs:
  build:
    name: WASM, types and production build
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.19.0'
          cache: npm
      - run: npm ci
      - run: mkdir -p out/ci
      - name: Restore kernels built from the same native sources
        id: kernels
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .generated
            public/licenses/freetype
          key: kernels-v1-${{ runner.os }}-${{ runner.arch }}-emsdk-6.0.9-${{ hashFiles('native/**', 'third_party/**', 'scripts/build-wasm.mjs', 'scripts/build-fonts.mjs') }}
      - name: Install native build tools
        if: steps.kernels.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y bison cmake ninja-build python3
      - uses: emscripten-core/setup-emsdk@4528d102f7230f0e7b276855c01ea1159be0e984 # v16
        if: steps.kernels.outputs.cache-hit != 'true'
        with:
          version: '6.0.9'
      - name: Build Asyncify, JSPI and font kernels
        if: steps.kernels.outputs.cache-hit != 'true'
        run: |
          mkdir -p out/ci
          # GitHub archive redirects intermittently return 504. Fetch from its
          # codeload endpoint and require the exact Emscripten port hashes.
          python3 - <<'PY' 2>&1 | tee out/ci/font-ports.log
          import ast, hashlib, json, os, pathlib, shutil, subprocess, tempfile, urllib.request
          emscripten = pathlib.Path(os.environ['EMSDK']) / 'upstream/emscripten'
          ports = pathlib.Path(subprocess.check_output([str(emscripten / 'em-config'), 'PORTS'], text=True).strip())
          ports.mkdir(parents=True, exist_ok=True)
          evidence = []
          for name, repo, extension in [('zlib', 'madler/zlib', 'tar.gz'), ('freetype', 'freetype/freetype', 'zip')]:
              source = (emscripten / 'tools/ports' / (name + '.py')).read_text()
              values = {}
              for item in ast.parse(source).body:
                  if isinstance(item, ast.Assign) and len(item.targets) == 1 and isinstance(item.targets[0], ast.Name):
                      key = item.targets[0].id
                      if key in ('VERSION', 'TAG', 'HASH'):
                          values[key] = ast.literal_eval(item.value)
              tag = 'v' + values['VERSION'] if name == 'zlib' else values['TAG']
              original = f'https://github.com/{repo}/archive/refs/tags/{tag}.tar.gz' if name == 'zlib' else f'https://github.com/{repo}/archive/{tag}.zip'
              url = f'https://codeload.github.com/{repo}/{extension}/refs/tags/{tag}'
              with urllib.request.urlopen(url, timeout=90) as response:
                  data = response.read()
              actual = hashlib.sha512(data).hexdigest()
              if actual != values['HASH']:
                  raise RuntimeError(f'{name} archive differs from pinned Emscripten SHA-512: {actual}')
              with tempfile.TemporaryDirectory(dir=ports) as temporary:
                  archive = pathlib.Path(temporary) / ('source.' + extension)
                  archive.write_bytes(data)
                  unpacked = pathlib.Path(temporary) / 'unpacked'
                  shutil.unpack_archive(archive, unpacked)
                  (unpacked / '.emscripten_url').write_text(original + '\n')
                  destination = ports / name
                  if destination.exists():
                      shutil.rmtree(destination)
                  os.replace(unpacked, destination)
              evidence.append({'name': name, 'tag': tag, 'url': url, 'bytes': len(data), 'sha512': actual})
              print(f'Prepared {name} {tag}: {actual}', flush=True)
          pathlib.Path('out/ci/font-ports.json').write_text(json.dumps(evidence, indent=2) + '\n')
          PY
          npm run build:wasm 2>&1 | tee out/ci/wasm.log
      - name: Cache compiled kernels
        if: steps.kernels.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .generated
            public/licenses/freetype
          key: ${{ steps.kernels.outputs.cache-primary-key }}
      - name: Check types and production release
        run: npm run build 2>&1 | tee out/ci/build.log
      - name: Build offline update fixtures
        run: node scripts/build-pwa-fixtures.mjs 2>&1 | tee out/ci/pwa-build.log
      - name: Package the exact build for all test jobs
        env:
          KERNEL_CACHE_KEY: ${{ steps.kernels.outputs.cache-primary-key }}
          KERNEL_CACHE_HIT: ${{ steps.kernels.outputs.cache-hit }}
        run: |
          node --input-type=module <<'JS'
          import { writeFileSync } from 'node:fs'
          writeFileSync('out/ci/build-info.json', JSON.stringify({
            commit: process.env.GITHUB_SHA,
            runId: process.env.GITHUB_RUN_ID,
            attempt: process.env.GITHUB_RUN_ATTEMPT,
            node: process.version,
            platform: process.platform,
            arch: process.arch,
            kernels: {
              cacheKey: process.env.KERNEL_CACHE_KEY,
              cacheHit: process.env.KERNEL_CACHE_HIT === 'true',
            },
          }, null, 2) + '\n')
          JS
          tar -czf "$RUNNER_TEMP/test-build.tar.gz" \
            .generated dist out/ci/build-info.json \
            out/verification/pwa/site-a out/verification/pwa/site-b \
            out/verification/pwa/fixture-artifacts.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-build
          path: ${{ runner.temp }}/test-build.tar.gz
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: build-logs
          path: out/ci/
          retention-days: 14

  node:
    name: Node conformance and integration
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/prepare-tests
      - name: Run Node tests
        run: |
          node --import tsx --test \
            --test-reporter=spec --test-reporter-destination=stdout \
            --test-reporter=tap --test-reporter-destination=out/ci/node.tap \
            tests/conformance/*.test.ts tests/integration/*.test.ts 2>&1 | tee out/ci/node.log
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: node-results
          path: out/ci/
          retention-days: 14

  browser:
    name: Browser / ${{ matrix.browser }} / ${{ matrix.suite }} (${{ matrix.os }})
    needs: build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      KRKR_TEST_HEADED: ${{ matrix.headed }}
      LIBGL_ALWAYS_SOFTWARE: '1'
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
        suite: [browser, library, pwa]
        include:
          - browser: chromium
            os: ubuntu-24.04
            headed: '0'
            workers: '2'
          - browser: firefox
            os: ubuntu-24.04
            headed: '1'
            workers: '2'
          - browser: webkit
            os: macos-15
            headed: '0'
            workers: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/prepare-tests
      - name: Install browser and system dependencies
        id: browser-install
        run: npx playwright install --with-deps "${{ matrix.browser }}"
      - name: Install virtual display, graphics and audio output
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y xvfb libgl1-mesa-dri mesa-utils pulseaudio pulseaudio-utils
          xvfb-run -a glxinfo -B
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=krkr_test_output rate=48000 channels=2
          pactl set-default-sink krkr_test_output
          pactl info
      - name: Verify Worker graphics before running game scenarios
        id: graphics
        run: bash scripts/ci-browser.sh node --import tsx tests/probes/browser-capabilities.ts "${{ matrix.browser }}" 2>&1 | tee out/ci/capabilities.log
      - name: Run browser suite
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: out/ci/results.json
          KRKR_TEST_BROWSER: ${{ matrix.browser }}
          KRKR_TEST_SUITE: ${{ matrix.suite }}
          KRKR_TEST_WORKERS: ${{ matrix.workers }}
        run: |
          case "$KRKR_TEST_SUITE" in
            browser) krkr_playwright_config=playwright.config.ts ;;
            library) krkr_playwright_config=playwright.library.config.ts ;;
            pwa) krkr_playwright_config=playwright.pwa.config.ts ;;
            *) exit 1 ;;
          esac
          bash scripts/ci-browser.sh npx playwright test -c "$krkr_playwright_config" \
            --project="$KRKR_TEST_BROWSER" --workers="$KRKR_TEST_WORKERS" --reporter=list,json,github 2>&1 | tee out/ci/results.log
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: browser-results-${{ matrix.browser }}-${{ matrix.suite }}
          path: |
            out/ci/
            test-results/
            out/verification/graphics/
          retention-days: 14

  native-activity:
    name: Chromium trusted lifecycle
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/prepare-tests
      - run: npx playwright install --with-deps chromium
      - name: Run native visibility and freeze tests
        run: npx playwright test -c playwright.activity.config.ts 2>&1 | tee out/ci/native-activity.log
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: native-activity-results
          path: |
            out/ci/
            out/verification/activity/native-check.json
            test-results-native-activity/
          retention-days: 14

  runtime:
    name: Direct runtime / three browsers
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/prepare-tests
      - run: npx playwright install --with-deps chromium firefox webkit
      - name: Run direct compile, dump, exception and cancellation probes
        run: node --import tsx tests/probes/vm-runtime-browser.ts 2>&1 | tee out/ci/runtime.log
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: runtime-results
          path: |
            out/ci/
            out/verification/vm-console/
          retention-days: 14

  tests:
    name: All tests
    if: always()
    needs: [build, node, browser, native-activity, runtime]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every job to pass
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          results = json.loads(os.environ['RESULTS'])
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('| Job | Result |\n| --- | --- |\n')
              for name, job in results.items():
                  summary.write(f"| {name} | {job['result']} |\n")
          sys.exit(0 if all(job['result'] == 'success' for job in results.values()) else 1)
          PY
