  png-reference:
    name: Fixed libpng 1.0.6 loader reference
    if: ${{ !inputs.node-only && !inputs.runtime-only }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the original-width C and zlib build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-multilib lib32z1-dev
      - name: Compile pinned libpng sources and record original loader calls
        run: python3 scripts/run-native-png-reference.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: native-png-reference
          path: out/verification/native-png/
          if-no-files-found: error
          retention-days: 90

  png-lowbit:
    name: Independent selected PNG low-bit and transparency contracts
    if: ${{ !inputs.runtime-only }}
    needs: png-kernel
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/prepare-tests
        with:
          image-kernel: zlib
      - name: Run all eight definitions with this run's production inflater
        run: |
          mkdir -p out/verification/png-lowbit
          cp .generated/image-zlib/manifest.json out/verification/png-lowbit/kernel-manifest.json
          node --import tsx --test --test-reporter=tap tests/conformance/png-lowbit.test.ts 2>&1 | tee out/verification/png-lowbit/node.tap
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: png-lowbit-results
          path: out/verification/png-lowbit/
          if-no-files-found: error
          retention-days: 90

  png-stream-comparison:
    name: PNG pull decoder and native write phases
    if: ${{ !inputs.node-only && !inputs.runtime-only }}
    needs: [png-kernel, png-reference]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/prepare-tests
        with:
          image-kernel: zlib
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: native-png-reference
          path: out/verification/native-png/
      - name: Compare full destination bytes and actual completion phases
