      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: runtime-results
          path: |
            out/ci/
            out/verification/vm-console/
          retention-days: 90

  compatibility:
    name: Original KAG and release compatibility
    if: ${{ !inputs.node-only && !inputs.runtime-only }}
    needs: build
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/compatibility.yml

  tests:
    name: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[application tests]') && 'Application and compatibility tests' || 'All tests' }}
    if: ${{ always() && !inputs.node-only && !inputs.runtime-only }}
    needs: [build, tools-types, legacy-fixture-result, deflate64-fixture-result, long-vorbis-fixture-result, cdda-aiff-fixture-result, node, browser, native-activity, runtime, compatibility, identity-allocations, cursor-reference, window-move-reference, window-geometry-reference, termination-reference, variant-stack-reference, lifetime-runtime-reference, menu-lifetime-runtime-reference, activity-wrapper-runtime-reference, png-kernel, png-lowbit, png-reference, png-stream-comparison, png-palette-comparison, jpeg-fixtures, jpeg-kernel, jpeg-reference, jpeg-comparison, legacy-media-kernel, eri-reference, original-sound-wine, kag-bookmarks, native-save-transfer, native-player-config]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every job to pass
        env:
          RESULTS: ${{ toJSON(needs) }}
          APPLICATION_TESTS: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[application tests]') }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          results = json.loads(os.environ['RESULTS'])
          historical_diagnostics = {
              'lifetime-runtime-reference', 'menu-lifetime-runtime-reference', 'activity-wrapper-runtime-reference'
          } if os.environ['APPLICATION_TESTS'] == 'true' else set()
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('| Job | Result |\n| --- | --- |\n')
              for name, job in results.items():
                  summary.write(f"| {name} | {job['result']} |\n")
          sys.exit(0 if all(job['result'] == ('skipped' if name in historical_diagnostics else 'success')
                            for name, job in results.items()) else 1)
          PY

