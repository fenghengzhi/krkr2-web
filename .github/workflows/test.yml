  native-save-transfer:
    name: Original Windows player reads Web save ZIPs
    needs: node
    if: ${{ !cancelled() && !inputs.node-only && !inputs.runtime-only && (needs.node.result == 'success' || needs.node.result == 'failure') }}
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.19.0'
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: web-native-saves
          path: out/verification/native-eri/player-saves/web/
      - name: Extract the Web ZIPs as desktop save directories
        shell: pwsh
        run: |
          $root = 'out/verification/native-eri/player-saves'
          foreach ($mode in 'source', 'bytecode') {
            $dest = Join-Path $root "game/$mode"
            New-Item -ItemType Directory -Force $dest | Out-Null
            Expand-Archive -LiteralPath "$root/web/$mode.zip" -DestinationPath $dest
          }
          node --import tsx tests/probes/native-save-transfer.ts prepare
      - name: Restore both bookmarks and display their thumbnails on the original SDK
        id: observe
        shell: pwsh
        run: ./tests/probes/original-eri.ps1 -Project player-saves
      - name: Compare original pixels, active macro and returned narrative positions
        if: ${{ !cancelled() && (steps.observe.outcome == 'success' || steps.observe.outcome == 'failure') }}
        run: node --import tsx tests/probes/native-save-transfer.ts compare
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: original-player-save-transfer
          path: out/verification/native-eri/player-saves/
          if-no-files-found: error
          retention-days: 90

