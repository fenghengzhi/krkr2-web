name: Tests
run-name: ${{ inputs.node-only && 'Node diagnostic (browser suites not run)' || inputs.runtime-only && 'Direct runtime diagnostic (application suites not run)' || github.event_name == 'push' && contains(github.event.head_commit.message, '[application tests]') && 'Application and compatibility tests' || 'Full test suite' }}

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      node-only:
        description: Run build and Node checks only; this is not a full regression result
        type: boolean
        default: false
      runtime-only:
        description: Run build and direct browser runtime checks only; not a full regression result
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}${{ inputs.node-only && '-node-diagnostic' || inputs.runtime-only && '-runtime-diagnostic' || '' }}
  # Keep the running suite and its evidence when a follow-up fix is queued.
  cancel-in-progress: false
  # Keep earlier pending batches too; the default single slot replaces them.
  queue: max

defaults:
  run:
    shell: bash

env:
  CI: 'true'

jobs:
  tools-types:
    name: Typecheck tests and build tools
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.19.0'
          cache: npm
      - run: npm ci
      - run: |
          mkdir -p out/ci
          npm run typecheck:tools 2>&1 | tee out/ci/types-tsconfig.tools.json.log
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: ${{ !cancelled() }}
        with:
          name: tools-typecheck-log
          path: out/ci/types-tsconfig.tools.json.log
          if-no-files-found: error
          retention-days: 90

  png-kernel:
    name: Production PNG inflater WebAssembly kernel
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: |
          mkdir -p out/ci
          cp native/image-zlib/source.json out/ci/image-zlib-source.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        id: node
        with:
          node-version: '24.19.0'
      - uses: emscripten-core/setup-emsdk@4528d102f7230f0e7b276855c01ea1159be0e984
        id: emsdk
        with:
          version: '6.0.9'
      - name: Prepare the exact zlib port source
        id: source
        run: python3 scripts/prepare-emscripten-ports.py --evidence out/ci/png-ports.json zlib 2>&1 | tee out/ci/png-ports.log
      - name: Build the PNG assets shared by the application and differential tests
        id: kernel
        run: |
          node scripts/build-image-zlib.mjs 2>&1 | tee out/ci/image-zlib.log
          tar -czf "$RUNNER_TEMP/zlib-kernel.tar.gz" .generated/image-zlib public/licenses/image-zlib
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: zlib-kernel
          path: ${{ runner.temp }}/zlib-kernel.tar.gz
          if-no-files-found: error
          retention-days: 90
      - name: Preserve source and toolchain step outcomes
        if: always()
        env:
          NODE_OUTCOME: ${{ steps.node.outcome }}
          EMSDK_OUTCOME: ${{ steps.emsdk.outcome }}
          SOURCE_OUTCOME: ${{ steps.source.outcome }}
          KERNEL_OUTCOME: ${{ steps.kernel.outcome }}
        run: |
          mkdir -p out/ci
          python3 - <<'PY'
          import json, os, pathlib
          fields = ['GITHUB_SHA', 'GITHUB_RUN_ID', 'GITHUB_RUN_ATTEMPT', 'NODE_OUTCOME', 'EMSDK_OUTCOME', 'SOURCE_OUTCOME', 'KERNEL_OUTCOME']
          pathlib.Path('out/ci/png-kernel-status.json').write_text(json.dumps({key: os.environ.get(key) for key in fields}, indent=2) + '\n')
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: png-kernel-build-logs
          path: |
            out/ci/
            out/native/image-zlib/compile-command.json
          if-no-files-found: error
          retention-days: 90

  jpeg-fixtures:
    name: Independent IJG fixture inputs
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Generate fixed-source inputs and record compiler output
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-multilib
          python3 scripts/run-native-jpeg-reference.py --fixtures-only --output out/verification/jpeg-fixtures
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: jpeg-fixtures
          path: out/verification/jpeg-fixtures/
          if-no-files-found: error
          retention-days: 90

  jpeg-kernel:
    name: Production IJG WebAssembly kernel
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.19.0'
      - uses: emscripten-core/setup-emsdk@4528d102f7230f0e7b276855c01ea1159be0e984
        with:
          version: '6.0.9'
      - name: Build the JPEG assets shared by the application and differential tests
        run: |
          mkdir -p out/ci
          node scripts/build-image-jpeg.mjs 2>&1 | tee out/ci/image-jpeg.log
          tar -czf "$RUNNER_TEMP/jpeg-kernel.tar.gz" .generated/image-jpeg public/licenses/image-jpeg
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: jpeg-kernel
          path: ${{ runner.temp }}/jpeg-kernel.tar.gz
          if-no-files-found: error
          retention-days: 90
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: jpeg-kernel-build-logs
          path: |
            out/ci/image-jpeg.log
            out/native/image-jpeg/compile-command.json
          retention-days: 90

  legacy-media-kernel:
    name: Production legacy movie WebAssembly converter
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.19.0'
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        id: legacy-cache
        with:
          path: |
            .generated/legacy-media
            public/licenses/legacy-media
          key: legacy-media-v1-${{ runner.os }}-${{ runner.arch }}-emsdk-6.0.9-${{ hashFiles('native/legacy-media/**', 'scripts/build-legacy-media.mjs') }}
      - uses: emscripten-core/setup-emsdk@4528d102f7230f0e7b276855c01ea1159be0e984
        if: steps.legacy-cache.outputs.cache-hit != 'true'
        with:
          version: '6.0.9'
      - name: Build only pinned legacy decoders and H264 AAC output
        if: steps.legacy-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p out/ci
          node scripts/build-legacy-media.mjs 2>&1 | tee out/ci/legacy-media.log
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        if: steps.legacy-cache.outputs.cache-hit != 'true'
        with:
          path: |
            .generated/legacy-media
            public/licenses/legacy-media
          key: ${{ steps.legacy-cache.outputs.cache-primary-key }}
      - name: Package the exact converter for application and hosted tests
        run: tar -czf "$RUNNER_TEMP/legacy-media-kernel.tar.gz" .generated/legacy-media public/licenses/legacy-media
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: legacy-media-kernel
          path: ${{ runner.temp }}/legacy-media-kernel.tar.gz
          if-no-files-found: error
          retention-days: 90
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: legacy-media-build-logs
          path: |
            out/ci/legacy-media.log
            out/native/legacy-media/commands.json
            out/native/legacy-media/source/ffmpeg-5.1.9/ffbuild/config.log
            .generated/legacy-media/manifest.json
          retention-days: 90

  build:
    name: WASM, types and production build
    # Still compile the main VM when an independent image build fails.
    if: ${{ !cancelled() }}
    needs: [jpeg-fixtures, jpeg-kernel, png-kernel, legacy-media-kernel]
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    outputs:
      legacy-fixtures: ${{ steps.legacy-fixtures.outcome }}
      windows-media-fixtures: ${{ steps.windows-media-fixtures.outcome }}
      deflate64-fixtures: ${{ steps.deflate64-fixtures.outcome }}
      long-vorbis-fixture: ${{ steps.long-vorbis-fixture.outcome }}
      cdda-aiff-fixtures: ${{ steps.cdda-aiff-fixtures.outcome }}
    steps:
      - name: Reject conflicting diagnostic selections
        if: ${{ inputs.node-only && inputs.runtime-only }}
        run: exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.19.0'
          cache: npm
      - run: npm ci
      - run: mkdir -p out/ci
      - name: Check pinned native TVP message catalog
        run: python3 scripts/generate-tvp-messages.py --check 2>&1 | tee out/ci/tvp-message-catalog.log
      - name: Check generated message syntax and the original failure control
        run: python3 tests/native/tvp-message-generation.py 2>&1 | tee out/ci/tvp-message-generation.log
      - name: Restore kernels built from the same native sources
        id: kernels
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .generated/wasm
            .generated/fonts
            public/licenses/freetype
          key: kernels-v1-${{ runner.os }}-${{ runner.arch }}-emsdk-6.0.9-${{ hashFiles('native/**', 'third_party/**', 'scripts/build-wasm.mjs', 'scripts/build-fonts.mjs', 'scripts/build-image-zlib.mjs', 'scripts/build-image-jpeg.mjs', 'scripts/prepare-emscripten-ports.py', 'scripts/generate-tvp-messages.py') }}
      - name: Install native build tools
        if: steps.kernels.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y bison cmake ninja-build python3
      - uses: emscripten-core/setup-emsdk@4528d102f7230f0e7b276855c01ea1159be0e984 # v16
        if: steps.kernels.outputs.cache-hit != 'true'
        with:
          version: '6.0.9'
      - name: Check native string append aliases and allocation failures
        run: |
          c++ -std=c++17 -O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer \
            -Ithird_party/tjs2 tests/native/string-append.cpp -o out/ci/string-append-native
          out/ci/string-append-native 2>&1 | tee out/ci/string-append-native.log
      - name: Build Asyncify, JSPI, font and image kernels
        if: steps.kernels.outputs.cache-hit != 'true'
        env:
          KRKR_SEPARATE_JPEG_BUILD: '1'
          KRKR_SEPARATE_PNG_BUILD: '1'
          KRKR_SEPARATE_LEGACY_MEDIA_BUILD: '1'
        run: |
          mkdir -p out/ci
          # The font port still needs its own zlib; its source preparation is
          # shared with the independent PNG build, not its compiled kernel.
          python3 scripts/prepare-emscripten-ports.py --evidence out/ci/font-ports.json zlib freetype 2>&1 | tee out/ci/font-ports.log
          npm run build:wasm 2>&1 | tee out/ci/wasm.log
      - name: Cache compiled kernels
        if: steps.kernels.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .generated/wasm
            .generated/fonts
            public/licenses/freetype
          key: ${{ steps.kernels.outputs.cache-primary-key }}
      - uses: ./.github/actions/restore-image-kernel
        with:
          kernel: zlib
      - uses: ./.github/actions/restore-image-kernel
        with:
          kernel: jpeg
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: legacy-media-kernel
          path: ${{ runner.temp }}/krkr-legacy-media
      - name: Restore this run's exact legacy movie converter
        run: tar -xzf "$RUNNER_TEMP/krkr-legacy-media/legacy-media-kernel.tar.gz"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: jpeg-fixtures
          path: out/verification/jpeg-fixtures/
      - name: Check application types and production release
        id: release
        run: (npm run typecheck:app && npm run bundle) 2>&1 | tee out/ci/build.log
      - name: Collect application TypeScript diagnostics after a release failure
        if: ${{ failure() && steps.release.outcome == 'failure' }}
        run: |
          failed=0
          for project in tsconfig.json tsconfig.worker.json tsconfig.engine.json; do
            if ! ./node_modules/.bin/tsc -p "$project" 2>&1 | tee "out/ci/types-$project.log"; then
              failed=1
            fi
          done
          exit "$failed"
      - name: Build offline update fixtures
        run: node scripts/build-pwa-fixtures.mjs 2>&1 | tee out/ci/pwa-build.log
      - name: Independently encode and read back Deflate64 games
        id: deflate64-fixtures
        continue-on-error: true
        timeout-minutes: 8
        run: |
          mkdir -p out/verification/deflate64-games
          sudo apt-get update 2>&1 | tee out/ci/deflate64-apt-update.log
          sudo apt-get install -y 7zip 2>&1 | tee out/ci/deflate64-apt-install.log
          node --import tsx scripts/generate-deflate64-game-fixtures.mjs 2>&1 | tee out/ci/deflate64-fixtures.log
      - name: Install independent movie fixture encoders
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Generate and independently decode Windows Media fixtures
        id: windows-media-fixtures
        continue-on-error: true
        run: |
          node --input-type=module <<'JS' 2>&1 | tee out/ci/windows-media-fixtures.log
          import { mkdirSync } from 'node:fs'
          import { generateWindowsMediaFixtures } from './scripts/generate-legacy-video-fixtures.mjs'
          const directory = 'out/verification/video-tracks'
          mkdirSync(directory, { recursive: true })
          generateWindowsMediaFixtures(directory)
          JS
      - name: Encode and independently decode long Vorbis music
        id: long-vorbis-fixture
        continue-on-error: true
        run: |
          mkdir -p out/verification/long-vorbis
          node scripts/generate-long-vorbis-fixture.mjs 2>&1 | tee out/ci/long-vorbis-fixture.log
      - name: Encode and independently decode AIFF disc tracks
        id: cdda-aiff-fixtures
        continue-on-error: true
        run: |
          mkdir -p out/verification/cdda-aiff
          node scripts/generate-cdda-aiff.mjs 2>&1 | tee out/ci/cdda-aiff.log
      - name: Generate shared project-owned video track fixtures
        run: |
          node scripts/generate-video-track-fixtures.mjs 2>&1 | tee out/ci/video-track-fixtures.log
      - name: Generate and independently decode legacy movie fixtures
        id: legacy-fixtures
        continue-on-error: true
        run: |
          node --input-type=module <<'JS' 2>&1 | tee out/ci/legacy-video-fixtures.log
          import { readFileSync, writeFileSync } from 'node:fs'
          import { generateLegacyVideoFixtures } from './scripts/generate-legacy-video-fixtures.mjs'
          const directory = 'out/verification/video-tracks'
          const path = directory + '/provenance.json'
          const provenance = JSON.parse(readFileSync(path, 'utf8'))
          provenance.legacyVideo = generateLegacyVideoFixtures(directory)
          writeFileSync(path, JSON.stringify(provenance, null, 2) + '\n')
          JS
      - name: Package the exact build for all test jobs
        env:
          KERNEL_CACHE_KEY: ${{ steps.kernels.outputs.cache-primary-key }}
          KERNEL_CACHE_HIT: ${{ steps.kernels.outputs.cache-hit }}
        run: |
          node --input-type=module <<'JS'
          import { writeFileSync } from 'node:fs'
          writeFileSync('out/ci/build-info.json', JSON.stringify({
            commit: process.env.GITHUB_SHA,
            runId: process.env.GITHUB_RUN_ID,
            attempt: process.env.GITHUB_RUN_ATTEMPT,
            node: process.version,
            platform: process.platform,
            arch: process.arch,
            kernels: {
              cacheKey: process.env.KERNEL_CACHE_KEY,
              cacheHit: process.env.KERNEL_CACHE_HIT === 'true',
            },
          }, null, 2) + '\n')
          JS
          tar -czf "$RUNNER_TEMP/test-build.tar.gz" \
            .generated dist out/ci/build-info.json \
            public/licenses/image-zlib public/licenses/image-jpeg public/licenses/legacy-media \
            out/verification/pwa/site-a out/verification/pwa/site-b \
            out/verification/pwa/fixture-artifacts.json out/verification/video-tracks \
            out/verification/deflate64-games \
            out/verification/long-vorbis \
            out/verification/cdda-aiff \
            out/verification/jpeg-fixtures/inputs \
            out/verification/jpeg-fixtures/case-manifest.json out/verification/jpeg-fixtures/codes.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-build
          path: ${{ runner.temp }}/test-build.tar.gz
          if-no-files-found: error
          retention-days: 90
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: build-logs
          path: out/ci/
          retention-days: 90
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: ${{ !cancelled() && (steps.deflate64-fixtures.outcome == 'success' || steps.deflate64-fixtures.outcome == 'failure') }}
        with:
          name: deflate64-fixture-evidence
          path: |
            out/verification/deflate64-games/
            out/ci/deflate64*.log
          if-no-files-found: error
          retention-days: 90
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: ${{ !cancelled() && (steps.windows-media-fixtures.outcome == 'success' || steps.windows-media-fixtures.outcome == 'failure') }}
        with:
          name: windows-media-fixture-evidence
          path: |
            out/verification/video-tracks/windows-media*
            out/verification/video-tracks/legacy-wmv*
          if-no-files-found: error
          retention-days: 90
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: ${{ !cancelled() && (steps.long-vorbis-fixture.outcome == 'success' || steps.long-vorbis-fixture.outcome == 'failure') }}
        with:
          name: long-vorbis-fixture-evidence
          path: out/verification/long-vorbis/
          if-no-files-found: error
          retention-days: 90
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: ${{ !cancelled() && steps.legacy-fixtures.outcome == 'failure' }}
        with:
          name: legacy-fixture-evidence
          path: |
            out/verification/video-tracks/legacy*.log
            out/verification/video-tracks/legacy-video-reference.json
            out/verification/video-tracks/legacy*.mpg
            out/verification/video-tracks/legacy*.avi
            out/verification/video-tracks/legacy*.m1v
            out/verification/video-tracks/legacy-authored.*
          if-no-files-found: error
          retention-days: 90
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: ${{ !cancelled() && (steps.cdda-aiff-fixtures.outcome == 'success' || steps.cdda-aiff-fixtures.outcome == 'failure') }}
        with:
          name: cdda-aiff-fixture-evidence
          path: |
            out/verification/cdda-aiff/
            out/ci/cdda-aiff.log
          if-no-files-found: error
          retention-days: 90

  deflate64-fixture-result:
    name: Independent Deflate64 fixture verification
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require complete 7-Zip games and multi-window reference
        env:
          FIXTURE_OUTCOME: ${{ needs.build.outputs.deflate64-fixtures }}
        run: test "$FIXTURE_OUTCOME" = success

  long-vorbis-fixture-result:
    name: Independent long Vorbis music fixture verification
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: Require the full long music reference
        env:
          FIXTURE_OUTCOME: ${{ needs.build.outputs.long-vorbis-fixture }}
        run: test "$FIXTURE_OUTCOME" = success

  cdda-aiff-fixture-result:
    name: Independent AIFF disc fixture verification
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require independently decoded AIFF disc tracks
        env:
          FIXTURE_OUTCOME: ${{ needs.build.outputs.cdda-aiff-fixtures }}
        run: test "$FIXTURE_OUTCOME" = success

  legacy-fixture-result:
    name: Independent legacy movie fixture verification
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: Require complete legacy movie references
        env:
          FIXTURE_OUTCOME: ${{ needs.build.outputs.legacy-fixtures }}
        run: test "$FIXTURE_OUTCOME" = success
      - name: Require complete Windows Media references
        if: ${{ !cancelled() }}
        env:
          FIXTURE_OUTCOME: ${{ needs.build.outputs.windows-media-fixtures }}
        run: test "$FIXTURE_OUTCOME" = success

  node:
    name: Node conformance and integration
    if: ${{ !inputs.runtime-only }}
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/prepare-tests
        id: prepare
      - name: Preserve native process crash diagnostics
        run: |
          # Installing gdb after a crash can upgrade libc and make the core's
          # build IDs disagree with the libraries used to read its backtrace.
          sudo apt-get update
          sudo apt-get install -y gdb
          gdb --version > out/ci/gdb-version.txt
          dpkg-query -W libc6 gdb > out/ci/node-debug-packages.txt
          ldd "$(command -v node)" > out/ci/node-linked-libraries.txt
          mkdir -p out/native-cores
          sudo sysctl -w "kernel.core_pattern=$GITHUB_WORKSPACE/out/native-cores/core.%e.%p" > out/ci/core-pattern.log
      - name: Run Node tests
        run: |
          ulimit -c unlimited
          node --import tsx --import ./scripts/record-node-test-process.mjs --test \
            --test-reporter=spec --test-reporter-destination=stdout \
            --test-reporter=tap --test-reporter-destination=out/ci/node.tap \
            --test-reporter=./scripts/record-node-test-events.mjs --test-reporter-destination=stdout \
            tests/conformance/*.test.ts tests/integration/*.test.ts 2>&1 | tee out/ci/node.log
      - name: Check variant pool reclamation through the JSPI kernel
        if: ${{ always() && steps.prepare.outcome == 'success' }}
        env:
          KRKR_VARIANT_STACK_VARIANT: jspi
        run: |
          ulimit -c unlimited
          node --experimental-wasm-jspi --import tsx --import ./scripts/record-node-test-process.mjs --test \
            --test-reporter=spec --test-reporter-destination=stdout \
            --test-reporter=tap --test-reporter-destination=out/ci/variant-stack-jspi.tap \
            tests/conformance/variant-stack.test.ts 2>&1 | tee out/ci/variant-stack-jspi.log
      - name: Check native random entropy and state through the JSPI kernel
        if: ${{ always() && steps.prepare.outcome == 'success' }}
        env:
          KRKR_RANDOM_VARIANT: jspi
        run: |
          ulimit -c unlimited
          node --experimental-wasm-jspi --import tsx --import ./scripts/record-node-test-process.mjs --test \
            --test-reporter=spec --test-reporter-destination=stdout \
            --test-reporter=tap --test-reporter-destination=out/ci/random-generator-jspi.tap \
            tests/conformance/random-generator.test.ts 2>&1 | tee out/ci/random-generator-jspi.log
      - name: Check native TVP messages through the JSPI kernel
        if: ${{ always() && steps.prepare.outcome == 'success' }}
        env:
          KRKR_MESSAGES_VARIANT: jspi
        run: |
          ulimit -c unlimited
          node --experimental-wasm-jspi --import tsx --import ./scripts/record-node-test-process.mjs --test \
            --test-reporter=spec --test-reporter-destination=stdout \
            --test-reporter=tap --test-reporter-destination=out/ci/tvp-messages-jspi.tap \
            tests/conformance/tvp-messages.test.ts 2>&1 | tee out/ci/tvp-messages-jspi.log
      - name: Check native container factory retirement through the JSPI kernel
        if: ${{ always() && steps.prepare.outcome == 'success' }}
        env:
          KRKR_CONTAINER_VARIANT: jspi
        run: |
          ulimit -c unlimited
          node --experimental-wasm-jspi --import tsx --import ./scripts/record-node-test-process.mjs --test \
            --test-reporter=spec --test-reporter-destination=stdout \
            --test-reporter=tap --test-reporter-destination=out/ci/native-container-factories-jspi.tap \
            tests/conformance/native-container-factories.test.ts 2>&1 | tee out/ci/native-container-factories-jspi.log
      - name: Check the JSPI MIDI octet capability before VM creation
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' }}
        env:
          KRKR_MIDI_VARIANT: jspi
        run: |
          node --experimental-wasm-jspi --import tsx --test --test-name-pattern='native MIDI octet support' \
            --test-reporter=tap tests/conformance/midi-output.test.ts | tee out/ci/midi-output-jspi.tap
      - name: Record backtraces for any terminated Node process
        if: always()
        run: |
          if compgen -G 'out/native-cores/core.*' > /dev/null; then
            mkdir -p out/ci/node-crashes
            for core in out/native-cores/core.*; do
              sha256sum "$core" >> out/ci/node-crashes/core-sha256.txt
              gdb --batch -ex 'set pagination off' -ex 'thread apply all bt' "$(command -v node)" "$core" > "out/ci/node-crashes/$(basename "$core").backtrace" 2>&1 || true
            done
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: node-results
          path: out/ci/
          retention-days: 90
      - name: Preserve the two portable save ZIPs for stock KRKR2
        if: ${{ !cancelled() && !inputs.node-only && steps.prepare.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: web-native-saves
          path: out/ci/web-native-saves/
          if-no-files-found: error
          retention-days: 90
      - name: Preserve original Node core bytes
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: node-native-cores
          path: out/native-cores/
          if-no-files-found: ignore
          retention-days: 90

  browser:
    name: Browser / ${{ matrix.browser }} / ${{ matrix.suite }}${{ matrix.shardIndex && format(' / shard {0}/{1}', matrix.shardIndex, matrix.shardTotal) || '' }} (${{ matrix.os }})
    if: ${{ !inputs.node-only && !inputs.runtime-only }}
    needs: build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      KRKR_TEST_HEADED: ${{ matrix.headed }}
      KRKR_TEST_BROWSER: ${{ matrix.browser }}
      KRKR_TEST_SUITE: ${{ matrix.suite }}
      KRKR_TEST_WORKERS: ${{ matrix.workers }}
      KRKR_TEST_SHARD_INDEX: ${{ matrix.shardIndex || '' }}
      KRKR_TEST_SHARD_TOTAL: ${{ matrix.shardTotal || '' }}
      LIBGL_ALWAYS_SOFTWARE: '1'
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
        suite: [browser, library, pwa]
        exclude:
          - browser: webkit
            suite: browser
          - browser: firefox
            suite: browser
        include:
          - browser: chromium
            os: ubuntu-24.04
            headed: '0'
            workers: '2'
          - browser: firefox
            os: ubuntu-24.04
            headed: '1'
            workers: '1'
          - browser: webkit
            os: macos-15
            headed: '0'
            workers: '1'
          # Each headed Firefox worker owns its display on a separate runner.
          # Four hosted shards reduce unreported tails in failure-heavy runs.
          # Preserve file order and assertion deadlines; never share a physical
          # pointer between two headed browser processes on one Xvfb server.
          - browser: firefox
            suite: browser
            os: ubuntu-24.04
            headed: '1'
            workers: '1'
            shardIndex: '1'
            shardTotal: '4'
          - browser: firefox
            suite: browser
            os: ubuntu-24.04
            headed: '1'
            workers: '1'
            shardIndex: '2'
            shardTotal: '4'
          - browser: firefox
            suite: browser
            os: ubuntu-24.04
            headed: '1'
            workers: '1'
            shardIndex: '3'
            shardTotal: '4'
          - browser: firefox
            suite: browser
            os: ubuntu-24.04
            headed: '1'
            workers: '1'
            shardIndex: '4'
            shardTotal: '4'
          # Keep each file's existing execution order and one worker per Mac.
          - browser: webkit
            suite: browser
            os: macos-15
            headed: '0'
            workers: '1'
            shardIndex: '1'
            shardTotal: '4'
          - browser: webkit
            suite: browser
            os: macos-15
            headed: '0'
            workers: '1'
            shardIndex: '2'
            shardTotal: '4'
          - browser: webkit
            suite: browser
            os: macos-15
            headed: '0'
            workers: '1'
            shardIndex: '3'
            shardTotal: '4'
          - browser: webkit
            suite: browser
            os: macos-15
            headed: '0'
            workers: '1'
            shardIndex: '4'
            shardTotal: '4'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Mark this hosted macOS job before starting any browsers
        if: runner.os == 'macOS' && runner.environment == 'github-hosted'
        run: |
          mkdir -p out/ci
          touch out/ci/native-reports-start.marker
          date -u '+%Y-%m-%dT%H:%M:%SZ' > out/ci/native-reports-start.txt
      - uses: ./.github/actions/prepare-tests
      - name: Record browser job and shared build identity
        run: |
          node --input-type=module <<'JS'
          import { readFileSync, writeFileSync } from 'node:fs'
          const project = process.env.KRKR_TEST_BROWSER
          const suite = process.env.KRKR_TEST_SUITE
          const index = process.env.KRKR_TEST_SHARD_INDEX
          const total = process.env.KRKR_TEST_SHARD_TOTAL
          if ((index || total) &&
              (!['webkit', 'firefox'].includes(project) || suite !== 'browser' ||
               !['1', '2', '3', '4'].includes(index) || total !== '4')) {
            throw new Error('Unexpected browser shard selection')
          }
          writeFileSync('out/ci/browser-job.json', JSON.stringify({
            commit: process.env.GITHUB_SHA,
            runId: process.env.GITHUB_RUN_ID,
            attempt: process.env.GITHUB_RUN_ATTEMPT,
            project,
            suite,
            shard: index ? `${index}/${total}` : null,
            shardIndex: index ? Number(index) : null,
            shardTotal: total ? Number(total) : null,
            workers: Number(process.env.KRKR_TEST_WORKERS),
            headed: process.env.KRKR_TEST_HEADED === '1',
            displayIsolation: process.env.KRKR_TEST_HEADED === '1' ? 'one-worker-per-hosted-display' : 'headless',
            build: JSON.parse(readFileSync('out/ci/build-info.json', 'utf8')),
          }, null, 2) + '\n')
          JS
      - name: Install browser and system dependencies
        id: browser-install
        run: npx playwright install --with-deps "${{ matrix.browser }}"
      - name: Install virtual display, graphics and audio output
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y xvfb x11-utils libgl1-mesa-dri mesa-utils pulseaudio pulseaudio-utils
          xvfb-run -a glxinfo -B
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=krkr_test_output rate=48000 channels=2
          pactl set-default-sink krkr_test_output
          pactl info
      - name: Verify Worker graphics before running game scenarios
        id: graphics
        run: bash scripts/ci-browser.sh node --import tsx tests/probes/browser-capabilities.ts "${{ matrix.browser }}" 2>&1 | tee out/ci/capabilities.log
      - name: Run browser suite
        env:
          # Correlate Firefox display failures and WebKit page crashes with native
          # process lifetimes; test deadlines and retry settings stay fixed.
          DEBUG: ${{ matrix.browser != 'chromium' && 'pw:browser' || '' }}
          PLAYWRIGHT_JSON_OUTPUT_NAME: out/ci/results.json
        run: |
          case "$KRKR_TEST_SUITE" in
            browser) krkr_playwright_config=playwright.config.ts ;;
            library) krkr_playwright_config=playwright.library.config.ts ;;
            pwa) krkr_playwright_config=playwright.pwa.config.ts ;;
            *) exit 1 ;;
          esac
          krkr_shard_args=()
          if [[ -n "$KRKR_TEST_SHARD_INDEX" ]]; then
            krkr_shard_args=("--shard=$KRKR_TEST_SHARD_INDEX/$KRKR_TEST_SHARD_TOTAL")
          fi
          bash scripts/ci-browser.sh npx playwright test -c "$krkr_playwright_config" \
            --project="$KRKR_TEST_BROWSER" --workers="$KRKR_TEST_WORKERS" \
            "${krkr_shard_args[@]}" --reporter=list,json,github 2>&1 | tee out/ci/results.log
      - name: Preserve new hosted macOS browser crash reports
        if: ${{ always() && runner.os == 'macOS' && runner.environment == 'github-hosted' }}
        run: |
          python3 - <<'PY'
          import datetime
          import hashlib
          import json
          import os
          import pathlib
          import platform
          import shutil
          import time

          # Never inspect a developer's Mac or a self-hosted runner.
          if (os.environ.get('GITHUB_ACTIONS') != 'true' or
                  os.environ.get('RUNNER_ENVIRONMENT') != 'github-hosted' or
                  platform.system() != 'Darwin'):
              raise SystemExit('Native report collection requires a GitHub-hosted Mac')
          output = pathlib.Path('out/ci/native-crashes')
          output.mkdir(parents=True, exist_ok=True)
          marker = pathlib.Path('out/ci/native-reports-start.marker')
          manifest = {
              'runId': os.environ.get('GITHUB_RUN_ID'),
              'attempt': os.environ.get('GITHUB_RUN_ATTEMPT'),
              'commit': os.environ.get('GITHUB_SHA'),
              'browser': os.environ.get('KRKR_TEST_BROWSER'),
              'suite': os.environ.get('KRKR_TEST_SUITE'),
              'shardIndex': os.environ.get('KRKR_TEST_SHARD_INDEX') or None,
              'shardTotal': os.environ.get('KRKR_TEST_SHARD_TOTAL') or None,
              'jobStarted': marker.exists(),
              'scope': 'New browser-related report candidates; correlate crash time and PID with Playwright logs',
              'roots': [], 'reports': [], 'errors': [], 'unrelatedNewReports': 0,
          }
          if marker.exists():
              started = marker.stat().st_mtime_ns
              manifest['markerMtimeNs'] = started
              # Allow ReportCrash a bounded interval to finish writing. An empty
              # result after this interval does not establish that no crash occurred.
              time.sleep(3)
              keywords = (b'webkit', b'webcontent', b'minibrowser', b'playwright',
                          b'javascriptcore', b'webprocess')
              manifest['matchKeywords'] = [word.decode() for word in keywords]
              for label, root in [
                  ('user', pathlib.Path.home() / 'Library/Logs/DiagnosticReports'),
                  ('system', pathlib.Path('/Library/Logs/DiagnosticReports')),
              ]:
                  manifest['roots'].append({'label': label, 'path': str(root), 'exists': root.exists()})
                  if not root.exists():
                      continue
                  try:
                      for report in root.rglob('*'):
                          if report.suffix.lower() not in ('.ips', '.crash') or not report.is_file():
                              continue
                          try:
                              info = report.stat()
                              birth = int(info.st_birthtime * 1_000_000_000)
                              if birth < started or info.st_mtime_ns < started:
                                  continue
                              payload = report.read_bytes()
                              candidate = report.name.encode().lower() + b'\n' + payload.lower()
                              matches = [word.decode() for word in keywords if word in candidate]
                              if not matches:
                                  manifest['unrelatedNewReports'] += 1
                                  continue
                              target = output / label / report.relative_to(root)
                              target.parent.mkdir(parents=True, exist_ok=True)
                              target.write_bytes(payload)
                              shutil.copystat(report, target)
                              manifest['reports'].append({
                                  'source': str(report), 'artifactPath': str(target),
                                  'size': len(payload), 'mtimeNs': info.st_mtime_ns,
                                  'birthtimeNs': birth, 'matchedKeywords': matches,
                                  'sha256': hashlib.sha256(payload).hexdigest(),
                              })
                          except OSError as error:
                              manifest['errors'].append({'path': str(report), 'error': str(error)})
                  except OSError as error:
                      manifest['errors'].append({'path': str(root), 'error': str(error)})
          manifest['collectedAt'] = datetime.datetime.now(datetime.timezone.utc).isoformat()
          (output / 'manifest.json').write_text(json.dumps(manifest, indent=2) + '\n')
          print(json.dumps(manifest, indent=2))
          if manifest['errors']:
              raise SystemExit('Some new native diagnostic reports could not be preserved')
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: browser-results-${{ matrix.browser }}-${{ matrix.suite }}${{ matrix.shardIndex && format('-shard-{0}-of-{1}', matrix.shardIndex, matrix.shardTotal) || '' }}
          path: |
            out/ci/
            test-results/
            out/verification/graphics/
          retention-days: 90

  native-activity:
    name: Chromium trusted lifecycle
    if: ${{ !inputs.node-only && !inputs.runtime-only }}
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/prepare-tests
      - run: npx playwright install --with-deps chromium
      - name: Run native visibility and freeze tests
        run: npx playwright test -c playwright.activity.config.ts 2>&1 | tee out/ci/native-activity.log
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: native-activity-results
          path: |
            out/ci/
            out/verification/activity/native-check.json
            test-results-native-activity/
