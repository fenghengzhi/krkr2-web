name: Original KRKR2 runtime observations

on:
  workflow_dispatch:
    inputs:
      suite:
        description: Original SDK observation suite
        type: choice
        options: [modal, menu, system-dialog, system-colors]
        default: modal

permissions:
  contents: read

jobs:
  original:
    name: Original SDK / ${{ matrix.os }} / ${{ matrix.scenario }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
        scenario: ${{ inputs.suite == 'menu' && fromJSON('["menu-0-select","menu-0-cancel","menu-128-select","menu-128-cancel","menu-256-select","menu-256-cancel","menu-384-select","menu-384-cancel"]') || inputs.suite == 'system-dialog' && fromJSON('["system-inform","system-input-unicode","system-input-empty","system-input-cancel"]') || inputs.suite == 'system-colors' && fromJSON('["system-colors"]') || fromJSON('["modal-close","modal-accepted-reclose","modal-hidden-timer","modal-parent-child"]') }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Observe the original SDK on its owned Windows process
        env:
          NATIVE_OS: ${{ matrix.os }}
          NATIVE_SCENARIO: ${{ matrix.scenario }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:GITHUB_ACTIONS -cne 'true' -or $env:RUNNER_ENVIRONMENT -cne 'github-hosted' -or $env:RUNNER_OS -cne 'Windows') {
            throw 'Original executable observations require a GitHub-hosted Windows runner.'
          }
          $output = Join-Path $env:GITHUB_WORKSPACE 'out/verification/original-runtime'
          New-Item -ItemType Directory -Force $output | Out-Null
          $status = [ordered]@{
            schema = 1; runId = $env:GITHUB_RUN_ID; attempt = $env:GITHUB_RUN_ATTEMPT
            commit = $env:GITHUB_SHA; runner = $env:NATIVE_OS; scenario = $env:NATIVE_SCENARIO
            state = 'not-run'; stage = 'download'; scope = 'Original SDK observations, not a Web runtime test'
            globalInputUsed = $false; pluginsLoadedByFixture = $false
            processDeadlineMs = 30000; timedOut = $false; exitCode = $null; error = $null
            environment = [ordered]@{
              OSDescription = [Runtime.InteropServices.RuntimeInformation]::OSDescription
              OSVersion = [Environment]::OSVersion.VersionString
              ImageOS = $env:ImageOS; ImageVersion = $env:ImageVersion
              processArchitecture = [Runtime.InteropServices.RuntimeInformation]::ProcessArchitecture.ToString()
              processArchitectureScope = 'PowerShell observation host; not an SDK binary architecture assertion'
            }
          }
          $process = $null
          $isSystemColors = $env:NATIVE_SCENARIO -ceq 'system-colors'
          $systemColorsDriverLoaded = $false
          $work = Join-Path $env:RUNNER_TEMP ('krkr2-original-' + [Guid]::NewGuid().ToString('N'))
          New-Item -ItemType Directory $work | Out-Null
          try {
            $pin = Get-Content tests/fixtures/native-reference/sdk.json -Raw | ConvertFrom-Json
            Copy-Item tests/fixtures/native-reference/sdk.json (Join-Path $output 'sdk.json')
            $archive = Join-Path $work 'sdk.zip'
            Invoke-WebRequest -Uri $pin.url -OutFile $archive
            if ((Get-Item $archive).Length -ne $pin.archiveBytes -or (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant() -cne $pin.archiveSha256) {
              throw 'Original SDK archive differs from the preserved bytes.'
            }
            $status.stage = 'extract'
            Add-Type -AssemblyName System.IO.Compression.FileSystem
            $zip = [IO.Compression.ZipFile]::OpenRead($archive)
            $engine = Join-Path $work 'krkr.eXe'
            try {
              $entry = $zip.GetEntry($pin.engineMember)
              if ($null -eq $entry) { throw 'Pinned engine member is missing.' }
              [IO.Compression.ZipFileExtensions]::ExtractToFile($entry, $engine)
            } finally { $zip.Dispose() }
            if ((Get-Item $engine).Length -ne $pin.engineBytes -or (Get-FileHash $engine -Algorithm SHA256).Hash.ToLowerInvariant() -cne $pin.engineSha256) {
              throw 'Original engine differs from the pinned SDK member.'
            }
            $status.engine = [ordered]@{
              bytes = (Get-Item $engine).Length; sha256 = (Get-FileHash $engine -Algorithm SHA256).Hash.ToLowerInvariant()
              fileVersion = (Get-Item $engine).VersionInfo.FileVersion; productVersion = (Get-Item $engine).VersionInfo.ProductVersion
            }
            $isSystemDialog = $env:NATIVE_SCENARIO -match '^system-(inform|input-unicode|input-empty|input-cancel)$'
            if ($isSystemDialog) { $dialogScenario = $Matches[1] }
            $isMenu = $env:NATIVE_SCENARIO -match '^menu-(0|128|256|384)-(select|cancel)$'
            if ($isMenu) {
              $menuFlags = [int] $Matches[1]
              $menuAction = $Matches[2]
              $menuToken = [Guid]::NewGuid().ToString('N')
              $fixture = 'tests/fixtures/native-reference/menu-popup.tjs'
              $driver = 'tests/probes/original-menu-driver.cs'
              Copy-Item $driver (Join-Path $output 'original-menu-driver.cs')
              $status.driverSha256 = (Get-FileHash $driver -Algorithm SHA256).Hash.ToLowerInvariant()
              Add-Type -Path $driver
            } elseif ($isSystemDialog) {
              $dialogToken = [Guid]::NewGuid().ToString('N')
              $fixture = 'tests/fixtures/native-reference/system-dialog.tjs'
              $driver = 'tests/probes/original-system-dialog-driver.cs'
              Copy-Item $driver (Join-Path $output 'original-system-dialog-driver.cs')
              $status.driverSha256 = (Get-FileHash $driver -Algorithm SHA256).Hash.ToLowerInvariant()
              Add-Type -Path $driver
            } elseif ($isSystemColors) {
              $status.stage = 'system-colors-inputs'
              $fixture = 'tests/fixtures/native-reference/system-colors.tjs'
              $sourceInputs = [ordered]@{
                fixture = $fixture
                plan = 'tests/fixtures/native-reference/system-colors-plan.md'
                cases = 'tests/fixtures/native-reference/system-colors-cases.json'
                schema = 'tests/fixtures/native-reference/system-colors.schema.json'
                sourceManifest = 'tests/fixtures/native-reference/system-colors-source.json'
                driver = 'tests/probes/original-system-colors.ps1'
              }
              $status.systemColorsInputs = [ordered]@{}
              foreach ($inputName in $sourceInputs.Keys) {
                $sourcePath = $sourceInputs[$inputName]
                $archivedPath = Join-Path $output (Split-Path $sourcePath -Leaf)
                Copy-Item $sourcePath $archivedPath
                $status.systemColorsInputs[$inputName] = [ordered]@{
                  file = Split-Path $archivedPath -Leaf
                  sha256 = (Get-FileHash $archivedPath -Algorithm SHA256).Hash.ToLowerInvariant()
                }
              }
              $systemColorsCases = Join-Path $output 'system-colors-cases.json'
              $status.sourceReference = (Get-Content $systemColorsCases -Raw -Encoding utf8 | ConvertFrom-Json).sourceReference
              $status.driverSha256 = $status.systemColorsInputs.driver.sha256
              $status.stage = 'source-reference'
              $sourceManifest = Get-Content (Join-Path $output 'system-colors-source.json') -Raw -Encoding utf8 | ConvertFrom-Json
              if ($sourceManifest.repository -cne $status.sourceReference.repository -or
                  $sourceManifest.commit -cne $status.sourceReference.commit -or
                  $sourceManifest.branchPath -cne $status.sourceReference.branchPath) {
                throw 'Source manifest differs from the declared static source reference.'
              }
              $sourceDirectory = Join-Path $output 'source-reference'
              New-Item -ItemType Directory -Force $sourceDirectory | Out-Null
              $status.sourceReferenceFiles = @()
              foreach ($sourcePin in $sourceManifest.files) {
                $sourceFile = Join-Path $sourceDirectory $sourcePin.file
                New-Item -ItemType Directory -Force (Split-Path $sourceFile -Parent) | Out-Null
                Invoke-WebRequest -Uri $sourcePin.url -OutFile $sourceFile
                $sourceObservation = [ordered]@{
                  file = $sourcePin.file; url = $sourcePin.url
                  expectedBytes = $sourcePin.bytes; bytes = (Get-Item $sourceFile).Length
                  expectedSha256 = $sourcePin.sha256
                  sha256 = (Get-FileHash $sourceFile -Algorithm SHA256).Hash.ToLowerInvariant()
                  verified = $false
                }
                $status.sourceReferenceFiles += $sourceObservation
                if ($sourceObservation.bytes -ne $sourcePin.bytes -or $sourceObservation.sha256 -cne $sourcePin.sha256) {
                  throw ('Static source reference differs from the preserved bytes: ' + $sourcePin.file)
                }
                $sourceObservation.verified = $true
              }
              $status.stage = 'system-colors-driver'
              . (Join-Path $output 'original-system-colors.ps1')
              $systemColorsDriverLoaded = $true
            } else {
              $fixture = Join-Path 'tests/fixtures/native-reference' ($env:NATIVE_SCENARIO + '.tjs')
            }
            $script = Get-Content $fixture -Raw -Encoding utf8
            if ($isMenu) {
              $script = $script.Replace('__NATIVE_FLAGS__', [string]$menuFlags).Replace('__NATIVE_ACTION__', $menuAction).Replace('__NATIVE_TOKEN__', $menuToken)
            } elseif ($isSystemDialog) {
              $script = $script.Replace('__NATIVE_SCENARIO__', $dialogScenario).Replace('__NATIVE_TOKEN__', $dialogToken)
            }
            $startup = Join-Path $work 'startup.tjs'
            [IO.File]::WriteAllText($startup, $script, [Text.UnicodeEncoding]::new($false, $true))
            Copy-Item $startup (Join-Path $output 'startup.tjs')
            $status.scriptSha256 = (Get-FileHash $startup -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($isSystemColors) {
              $status.stage = 'system-palette'
              Read-OriginalSystemPalette -OutputDirectory $output | Out-Null
            }
            $status.stage = 'execution'
            # The SDK's Startup.html requires an explicit project folder (or
            # data/content-data). The executable's working directory alone is
            # not a project-selection rule. Keep the exact arguments as evidence.
            $arguments = '"' + $work + '" -forcelog=yes'
            $status.arguments = $arguments
            $processClock = [Diagnostics.Stopwatch]::StartNew()
            $process = Start-Process -FilePath $engine -WorkingDirectory $work -ArgumentList $arguments -PassThru `
              -RedirectStandardOutput (Join-Path $output 'stdout.log') `
              -RedirectStandardError (Join-Path $output 'stderr.log')
            $status.processId = $process.Id
            $null = $process.Handle
            if ($isMenu) {
              $status.input = [OriginalMenuDriver]::Observe($process, $work, $menuToken, $menuFlags, $menuAction, $processClock)
              if ($status.input.State -cne 'observed') {
                $status.stage = 'menu-input'
                throw ('Owned menu input was not established: ' + $status.input.Reason)
              }
            } elseif ($isSystemDialog) {
              $status.input = [OriginalSystemDialogDriver]::Observe($process, $work, $dialogToken, $dialogScenario, $processClock)
              if ($status.input.State -cne 'observed') {
                $status.stage = 'system-dialog-input'
                throw ('Owned System dialog input was not established: ' + $status.input.Reason)
              }
            }
            $remainingMs = [Math]::Max(0, 30000 - [int]$processClock.ElapsedMilliseconds)
            if (-not $process.WaitForExit($remainingMs)) {
              $status.timedOut = $true
              $status.state = 'timed-out'
              Stop-Process -Id $process.Id -Force
              $process.WaitForExit()
              throw 'Original engine exceeded the owned-process deadline.'
            }
            $status.exitCode = $process.ExitCode
            $status.stage = 'evidence'
            $eventsFile = Join-Path $work 'native-events.txt'
            if (-not (Test-Path $eventsFile)) { throw 'Original script produced no observation file.' }
            Copy-Item $eventsFile (Join-Path $output 'native-events.txt')
            $events = [IO.File]::ReadAllLines($eventsFile)
            $status.events = $events
            if ($process.ExitCode -ne 0 -or $events -cnotcontains 'observations-complete' -or ($events | Where-Object { $_.StartsWith('error:') })) {
              throw 'Original script did not complete every requested observation.'
            }
            if ($isSystemColors) {
              $status.stage = 'structured-evidence'
              Convert-OriginalSystemColorObservations -EventsPath (Join-Path $output 'native-events.txt') `
                -OutputDirectory $output -CasesPath $systemColorsCases -Status $status | Out-Null
            }
            # Do not predeclare the VCL ordering being investigated as the oracle.
            # Completion means these events were observed; their values are compared separately.
            $status.state = 'observed'
            $status.stage = 'complete'
          } catch {
            if (-not $status.timedOut) { $status.state = 'failed' }
            $status.error = $_.Exception.ToString()
            throw
          } finally {
            if ($null -ne $process -and -not $process.HasExited) {
              Stop-Process -Id $process.Id -Force
              $process.WaitForExit()
            }
            foreach ($file in Get-ChildItem -LiteralPath $work -File -ErrorAction SilentlyContinue) {
              if ($file.Extension -in @('.log', '.txt')) { Copy-Item $file.FullName (Join-Path $output $file.Name) -Force }
            }
            if ($isSystemColors -and $systemColorsDriverLoaded -and $status.state -cne 'observed') {
              try {
                Convert-OriginalSystemColorObservations -EventsPath (Join-Path $output 'native-events.txt') `
                  -OutputDirectory $output -CasesPath $systemColorsCases -Status $status -AllowIncomplete | Out-Null
              } catch {
                # Partial conversion is secondary evidence and must not replace
                # the original execution/completion/conversion failure.
                $status.partialConversionError = $_.Exception.ToString()
              }
            }
            $status.completedAt = [DateTime]::UtcNow.ToString('o')
            $status | ConvertTo-Json -Depth 12 | Set-Content (Join-Path $output 'status.json') -Encoding utf8
          }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: original-runtime-${{ matrix.os }}-${{ matrix.scenario }}-${{ github.run_attempt }}
          path: out/verification/original-runtime
          if-no-files-found: error
          retention-days: 30
