name: Native lifecycle diagnostic

on:
  workflow_dispatch:
    inputs:
      build-run:
        description: Completed build run ID whose application sources match this commit
        required: true
        type: string

permissions:
  contents: read
  actions: read

env:
  CI: 'true'

defaults:
  run:
    shell: bash

jobs:
  freeze:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/prepare-tests
        with:
          build-run: ${{ inputs.build-run }}
      - run: npm run typecheck
      - run: npx playwright install --with-deps chromium
      - name: Repeat the real long-freeze scenario with failure diagnostics
        run: npx playwright test -c playwright.activity.config.ts freeze-deadlines.spec.ts --repeat-each=3 2>&1 | tee out/ci/native-diagnostic.log
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: native-diagnostic-results
          path: |
            out/ci/
            out/verification/activity/native-check.json
            test-results-native-activity/
          retention-days: 90
