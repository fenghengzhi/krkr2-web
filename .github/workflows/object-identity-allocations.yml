name: Object identity allocation diagnostic

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  CI: 'true'
  KRKR_TEST_ALLOCATOR: '1'

jobs:
  identity-allocations:
    name: Object identity allocator / ${{ matrix.variant }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        variant: [asyncify, jspi]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.19.0'
          cache: npm
      - run: npm ci
      - run: mkdir -p out/ci
      - name: Install native build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y bison cmake ninja-build python3
      - uses: emscripten-core/setup-emsdk@4528d102f7230f0e7b276855c01ea1159be0e984 # v16
        with:
          version: '6.0.9'
      - name: Build allocator-instrumented identity kernel from this commit
        run: node scripts/build-wasm.mjs "${{ matrix.variant }}" 2>&1 | tee out/ci/identity-build.log
      - name: Sweep identity observation and upgrade allocation failures
        run: node --experimental-wasm-jspi --import tsx tests/probes/object-identity-allocations.ts "${{ matrix.variant }}" 2>&1 | tee out/ci/object-identity-allocations.log
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: object-identity-allocations-${{ matrix.variant }}
          path: |
            out/ci/
            .generated/wasm/
          include-hidden-files: true
          retention-days: 30
