name: WebKit startup diagnostic

on:
  workflow_dispatch:
    inputs:
      build-run:
        description: Completed build run ID whose application sources match this commit
        required: true
        type: string
      workers:
        description: Concurrent browser workers for comparing hosted resource contention
        type: choice
        default: '2'
        options: ['1', '2']

permissions:
  contents: read
  actions: read

env:
  CI: 'true'
  KRKR_STARTUP_MEDIA: '1'

defaults:
  run:
    shell: bash

jobs:
  startup:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/prepare-tests
        with:
          build-run: ${{ inputs.build-run }}
      - run: npm run typecheck
      - run: npx playwright install --with-deps webkit
      - name: Record Worker startup spans and native stacks
        env:
          KRKR_DIAGNOSTIC_WORKERS: ${{ inputs.workers }}
        run: npx playwright test -c tests/probes/playwright.startup.config.ts --repeat-each=3 --workers="$KRKR_DIAGNOSTIC_WORKERS" 2>&1 | tee out/ci/webkit-diagnostic.log
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: webkit-diagnostic-results
          path: |
            out/ci/
            test-results-webkit-diagnostic/
          retention-days: 14
