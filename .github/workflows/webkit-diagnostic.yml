name: WebKit scenario diagnostic

on:
  workflow_dispatch:
    inputs:
      build-run:
        description: Completed build run ID whose application sources match this commit
        required: true
        type: string
      scenario:
        description: Focused startup, restart, or Clipboard scenarios; not a full regression
        type: choice
        default: startup
        options: [startup, font-restart, player-restart, clipboard]
      workers:
        description: Concurrent browser workers for comparing hosted resource contention
        type: choice
        default: '2'
        options: ['1', '2']

permissions:
  contents: read
  actions: read

env:
  CI: 'true'
  KRKR_STARTUP_MEDIA: '1'

defaults:
  run:
    shell: bash

jobs:
  startup:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/prepare-tests
        with:
          build-run: ${{ inputs.build-run }}
      - run: npm run typecheck
      - run: npx playwright install --with-deps webkit
      - name: Mark the beginning of the selected hosted browser scenario
        run: |
          mkdir -p out/ci
          touch out/ci/native-reports-start.marker
          date -u '+%Y-%m-%dT%H:%M:%SZ' > out/ci/native-reports-start.txt
      - name: Record Worker startup spans and native stacks
        if: inputs.scenario == 'startup'
        env:
          KRKR_DIAGNOSTIC_WORKERS: ${{ inputs.workers }}
        run: npx playwright test -c tests/probes/playwright.startup.config.ts --repeat-each=3 --workers="$KRKR_DIAGNOSTIC_WORKERS" 2>&1 | tee out/ci/webkit-diagnostic.log
      - name: Repeat font dialog cancellation and fresh session startup
        if: inputs.scenario == 'font-restart'
        env:
          KRKR_DIAGNOSTIC_WORKERS: ${{ inputs.workers }}
          DEBUG: pw:browser,pw:protocol
          PLAYWRIGHT_JSON_OUTPUT_NAME: out/ci/font-restart.json
        run: npx playwright test tests/browser/font-selection.spec.ts --project=webkit --grep 'a font dialog during startup' --repeat-each=10 --workers="$KRKR_DIAGNOSTIC_WORKERS" --reporter=line,json 2>&1 | tee out/ci/font-restart.log
      - name: Repeat the original player startup and fresh restart scene
        if: inputs.scenario == 'player-restart'
        env:
          KRKR_DIAGNOSTIC_WORKERS: ${{ inputs.workers }}
          DEBUG: pw:browser,pw:protocol
          PLAYWRIGHT_JSON_OUTPUT_NAME: out/ci/player-restart.json
        run: npx playwright test tests/browser/player.spec.ts --project=webkit --grep 'real TJS scene, input, pause, stop and fresh restart' --repeat-each=10 --workers="$KRKR_DIAGNOSTIC_WORKERS" --reporter=line,json 2>&1 | tee out/ci/player-restart.log
      - name: Check real Clipboard permissions and recovery
        if: inputs.scenario == 'clipboard'
        env:
          KRKR_DIAGNOSTIC_WORKERS: ${{ inputs.workers }}
          DEBUG: pw:browser
          PLAYWRIGHT_JSON_OUTPUT_NAME: out/ci/clipboard.json
        run: npx playwright test tests/browser/clipboard.spec.ts --project=webkit --workers="$KRKR_DIAGNOSTIC_WORKERS" --reporter=list,json 2>&1 | tee out/ci/clipboard.log
      - name: Preserve new macOS native crash reports from this scenario
        if: always()
        run: |
          python3 - <<'PY'
          import datetime
          import json
          import pathlib
          import shutil
          import time

          output = pathlib.Path('out/ci/native-crashes')
          output.mkdir(parents=True, exist_ok=True)
          marker = pathlib.Path('out/ci/native-reports-start.marker')
          manifest = {
              'collectedAt': datetime.datetime.now(datetime.timezone.utc).isoformat(),
              'scenarioStarted': marker.exists(),
              'roots': [], 'reports': [], 'errors': [],
          }
          if marker.exists():
              started = marker.stat().st_mtime_ns
              manifest['markerMtimeNs'] = started
              # ReportCrash can finish writing shortly after Playwright exits.
              # This wait and all report inspection run only on the hosted Mac.
              time.sleep(3)
              roots = [
                  ('user', pathlib.Path.home() / 'Library/Logs/DiagnosticReports'),
                  ('system', pathlib.Path('/Library/Logs/DiagnosticReports')),
              ]
              for label, root in roots:
                  manifest['roots'].append({'label': label, 'path': str(root), 'exists': root.exists()})
                  if not root.exists():
                      continue
                  try:
                      for report in root.rglob('*'):
                          if report.suffix not in ('.ips', '.crash') or not report.is_file():
                              continue
                          try:
                              info = report.stat()
                              if info.st_mtime_ns < started:
                                  continue
                              target = output / label / report.relative_to(root)
                              target.parent.mkdir(parents=True, exist_ok=True)
                              shutil.copy2(report, target)
                              manifest['reports'].append({
                                  'source': str(report), 'artifactPath': str(target),
                                  'size': info.st_size, 'mtimeNs': info.st_mtime_ns,
                              })
                          except OSError as error:
                              manifest['errors'].append({'path': str(report), 'error': str(error)})
                  except OSError as error:
                      manifest['errors'].append({'path': str(root), 'error': str(error)})
          (output / 'manifest.json').write_text(json.dumps(manifest, indent=2) + '\n')
          print(json.dumps(manifest, indent=2))
          if manifest['errors']:
              raise SystemExit('Some new native diagnostic reports could not be preserved')
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: webkit-diagnostic-results
          path: |
            out/ci/
            test-results/
            test-results-webkit-diagnostic/
          retention-days: 14
